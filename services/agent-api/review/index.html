<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小朵 · Workflow 归属核对</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;color:#30283d;background:#f5f3f8;line-height:1.55;color-scheme:light;--surface:#fff;--ink:#30283d;--quiet:#746980;--accent:#6d4c91;--soft:#eee7f5;--line:#e6e0ed;--tint:#faf8fc;--warning:#8b5626}*{box-sizing:border-box}body{margin:0}button,input,a{font:inherit}button,a,input{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #a287c1}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}main{max-width:1280px;padding:30px 32px 48px;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;font-size:14px}.brand{font-weight:650}.download{color:var(--accent);text-underline-offset:4px}header{margin:36px 0 27px}h1{font-size:clamp(29px,3.3vw,42px);font-weight:620;letter-spacing:-.04em;line-height:1.25;margin:0 0 12px}header p{color:var(--quiet);margin:0;font-size:15px}.boundary{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:12px;color:var(--quiet)}.boundary span{width:7px;height:7px;border:1.5px solid var(--accent);border-radius:50%}.flow{display:flex;flex-wrap:wrap;list-style:none;padding:0;margin:24px 0 0;gap:8px 0;color:var(--quiet);font-size:12px}.flow li:not(:last-child)::after{content:'›';margin:0 14px;color:#a99cb7}.flow li[aria-current=step]{font-weight:650;color:var(--accent)}.layout{display:grid;grid-template-columns:195px minmax(0,1fr) 220px;gap:22px;align-items:start}.cases summary{font-size:12px;color:var(--quiet);padding:9px 8px;cursor:pointer;list-style-position:inside}.cases details+details{margin-top:15px}.case-list{display:flex;flex-direction:column;gap:3px}.case-button{border:0;background:transparent;color:var(--quiet);text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;min-height:44px}.case-button[aria-pressed=true]{background:var(--soft);color:var(--accent);font-weight:600}.case-button:hover{background:var(--soft)}.console{background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;min-width:0}.context{padding:17px 24px;border-bottom:1px solid var(--line);font-size:12px;color:var(--quiet);display:flex;justify-content:space-between;gap:12px}.context strong{font-weight:500;color:var(--ink)}.conversation{padding:27px 26px 24px}.by{font-size:12px;color:var(--quiet)}.user-message{margin-left:20px;text-align:right}.user-message blockquote{display:inline-block;text-align:left;margin:7px 0 29px;padding:13px 18px;background:var(--soft);border-radius:17px 17px 4px 17px;font-size:18px;overflow-wrap:anywhere;max-width:100%}.agent-mark{font-size:12px;color:var(--accent);font-weight:600}.agent-mark::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px}h2{font-size:21px;font-weight:560;letter-spacing:-.02em;margin:10px 0 15px;line-height:1.6;overflow-wrap:anywhere}.support{font-size:13px;color:var(--quiet);margin:0 0 16px}.choices{display:grid;gap:9px}.choice{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:14px;text-align:left;padding:13px 16px;background:var(--surface);color:var(--ink);min-height:55px}.choice:hover{border-color:var(--accent);background:var(--tint)}.choice strong{font-size:15px;font-weight:550}.choice small{font-size:12px;color:var(--quiet)}.choice.unbudgeted{background:var(--tint)}.receipt{padding:20px;background:var(--tint);border-radius:16px;margin-top:17px}.receipt .amount{font-size:31px;letter-spacing:-.04em;font-weight:550;line-height:1.25;overflow-wrap:anywhere}.receipt .original{font-size:12px;color:var(--quiet);margin-top:5px}.receipt dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;margin:18px 0 0;font-size:13px}.receipt dt{color:var(--quiet)}.receipt dd{margin:0;text-align:right;overflow-wrap:anywhere}.status{font-size:12px;color:var(--accent);margin-top:15px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:19px}.action-button{border:0;border-radius:12px;padding:12px 16px;min-height:44px;background:var(--soft);color:var(--accent);font-size:14px}.action-button.primary{background:var(--accent);color:white}.action-button.quiet{background:transparent;color:var(--quiet)}.footer-note{font-size:11px;color:var(--quiet);margin-top:16px}.tools{border-top:1px solid var(--line);padding:13px 26px;background:var(--tint)}.tools summary{font-size:12px;color:var(--quiet);cursor:pointer}.tools form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}.tools label{font-size:12px;color:var(--quiet);display:flex;flex-direction:column;gap:7px}.tools input{width:100%;min-width:0;min-height:42px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px}.tools button{grid-column:1/-1}.checks{padding:9px 0}.checks h3{font-size:13px;font-weight:600;margin:0 0 19px}.check{display:grid;grid-template-columns:18px 1fr;gap:8px;margin:0 0 20px;font-size:12px}.check .mark{color:var(--accent)}.check .mark.blocked{color:var(--warning)}.check strong{display:block;font-weight:500;color:var(--quiet);margin-bottom:4px}.check p{margin:0;overflow-wrap:anywhere}.explanation{font-size:12px;color:var(--quiet);border-top:1px solid var(--line);padding-top:16px;margin-top:5px}.technical{margin-top:20px;font-size:12px;color:var(--quiet)}.technical summary{cursor:pointer;min-height:30px}.technical pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border-radius:12px;padding:14px;max-height:400px;overflow:auto}.bottom{font-size:12px;color:var(--quiet);margin-top:26px;text-align:center}.export-hint{display:none}
.mobile-selector{display:none}.mobile-selector select{width:100%;min-height:46px;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);font-size:14px}@media(max-width:650px){.mobile-selector{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--quiet)}#case-groups{display:none}}
@media(max-width:1050px){.layout{grid-template-columns:175px minmax(0,1fr)}.checks{grid-column:2}.check-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}.explanation{max-width:65ch}}@media(max-width:650px){main{padding:22px 16px 35px}header{margin:29px 0 20px}.layout{grid-template-columns:minmax(0,1fr);gap:18px}.cases{min-width:0}.case-list{flex-direction:row;flex-wrap:wrap;gap:5px}.case-button{font-size:12px;padding:8px 10px;min-height:40px}.cases details+details{margin-top:5px}.console{border-radius:21px}.conversation{padding:23px 20px}.context{padding:14px 20px;flex-wrap:wrap}.checks{grid-column:1;padding:5px 5px 0}h2{font-size:20px}.user-message blockquote{font-size:17px}.tools{padding:13px 20px}.flow li:not(:last-child)::after{margin:0 9px}.download{font-size:12px}.receipt{padding:17px}.receipt .amount{font-size:29px}}@media(prefers-reduced-motion:no-preference){button{transition:background .12s ease,border-color .12s ease}}@media(prefers-color-scheme:dark){:root{background:#211d27;color:#eee7f5;color-scheme:dark;--surface:#2c2634;--ink:#eee7f5;--quiet:#b8acc6;--accent:#c5a8e6;--soft:#40324e;--line:#493e54;--tint:#302837;--warning:#e7bb8e}.action-button.primary{color:#241b2e}}
</style>
<main>
 <div class="topbar"><span class="brand">CheckLine · 小朵</span><a class="download" href="/review/download.html" download="checkline-workflow-review.html" id="download">保存独立 HTML</a></div>
 <header>
  <h1>这笔，记到哪里？</h1>
  <p>点选案例，查看小朵如何核对预算卡和所属周期。</p>
  <div class="boundary"><span aria-hidden="true"></span>固定虚构案例，未调用模型，未连接手机账本。</div>
  <ol class="flow" aria-label="记录流程"><li>理解输入</li><li id="flow-date">核对日期</li><li id="flow-card">确认预算与周期</li><li id="flow-rate">检查币种</li><li id="flow-save">记录与撤销</li></ol>
 </header>
 <div class="layout">
  <nav class="cases" aria-label="选择审阅案例" id="cases"><label class="mobile-selector">查看案例<select id="mobile-cases"></select></label><div id="case-groups"></div></nav>
  <section class="console" aria-label="对话流程演示">
   <div class="context"><strong id="scenario">正在准备案例…</strong><span id="entry"></span></div>
   <div class="conversation" aria-live="polite" aria-atomic="false">
    <div class="user-message"><span class="by">你</span><br><blockquote id="input"></blockquote></div>
    <div class="agent-mark">小朵</div>
    <h2 id="prompt"></h2><p class="support" id="support" hidden></p>
    <div id="choices" class="choices" aria-label="选择预算归属"></div>
    <section class="receipt" id="receipt" aria-label="这笔消费的核对摘要" hidden></section>
    <div class="status" id="status" role="status"></div>
    <div class="actions" id="actions"></div>
    <div class="footer-note">操作仅模拟流程，不保存消费。</div>
   </div>
   <details class="tools" id="edit"><summary>改一下字段，检查是否重新核对</summary><form id="edit-form"><label>消费日期<input id="edit-date" type="date" required></label><label>原币金额<input id="edit-amount" inputmode="decimal" pattern="[0-9]+(\.[0-9]+)?" required></label><button class="action-button" type="submit">应用到当前示例</button></form></details>
  </section>
  <aside class="checks" aria-label="当前核对状态">
   <h3>当前核对</h3><div id="checks" class="check-list"></div>
   <p class="explanation" id="explanation"></p>
   <details class="technical"><summary>查看接口候选与本机门禁</summary><pre id="json"></pre></details>
   <button class="action-button quiet" id="reset" type="button">重新查看本例</button>
  </aside>
 </div>
 <div class="bottom">确认流程后，由 Rex 部署 API，再接入 App 并测试真实模型。</div>
</main>

</html>
