<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CheckLine · 可交互原型</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><aside class="sidebar"><h1>CheckLine</h1><p>基于现有版本的设计原型</p><h3>页面与状态</h3><div id="page-list"></div></aside><section class="stage"><div class="stagebar"><strong id="current-name">加载中</strong><select id="mobile-page" aria-label="选择页面或状态"></select><div class="switch" aria-label="外观"><button data-theme-choice="light">浅色</button><button data-theme-choice="dark">暗色</button></div></div><div class="phone-wrap"><div class="phone" id="phone"></div></div></section><aside class="notes"><h2>从关键流程开始</h2><button class="flow" data-flow="record">记一笔 → 保存</button><button class="flow" data-flow="pending-review">待确认 → 结算</button><button class="flow" data-flow="wishes">心愿 → 兑换</button><p>页面内可点击控件以合成数据演示状态切换。表单使用固定示例，不能输入或保存真实数据；系统权限仅作占位。</p><small>可在左侧选择页面；面板内容可滚动。系统动作显示占位说明。</small></aside></main><div id="notice" class="notice" hidden></div><script src="states.js"></script><script src="screen-model.js"></script><script src="adapter.js"></script></body></html>
