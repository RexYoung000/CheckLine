<header><div><div class="eyebrow">CHECKLINE / CLOUD STUDY 04</div><h1>一朵云，慢慢形成。</h1></div><p>云絮沿着轻风融入，再从另一侧散开。<br>试着看它安静地循环几次。</p></header>
<div class="toolbar"><div class="modes" role="group" aria-label="动作场景"><button data-mode="idle" aria-pressed="false">轻待机</button><button data-mode="thinking" aria-pressed="true">思考循环</button></div><button id="theme" aria-pressed="false">深色背景</button></div>

<div class="contexts"><section class="context" aria-label="44 像素头像预览"><svg class="avatar" data-cloud></svg><div><strong>小头像 · 44 px</strong><p>看轮廓是否稳定，边缘是否干净。</p></div></section><section class="context" aria-label="Agent 标题区预览"><svg class="assistant-avatar" data-cloud></svg><div><strong>预算助手</strong><p id="context">正在整理你的想法…</p></div></section></div>
<section class="player" aria-label="动画播放控制"><div class="timeline"><span id="stage">云絮靠近</span><input id="seek" type="range" aria-label="循环时间" min="0" max="6.4" step=".01" value="0"><span id="timer">0.0 / 6.4 秒</span></div><div class="controls"><button id="play" aria-pressed="false">播放</button><button id="replay">从头看</button><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value=".5">0.5 倍慢放</option></select><label><input id="reduce" type="checkbox">减少动态</label></div></section>
<nav class="beats" aria-label="静看四个阶段"><button data-time=".85"><small>01 / 靠近</small>云絮沿风向汇入</button><button data-time="2.05"><small>02 / 凝聚</small>融进原有轮廓</button><button data-time="4.15"><small>03 / 消散</small>边缘化成细颗粒</button><button data-time="6.2"><small>04 / 停留</small>完整云朵接回循环</button></nav>
