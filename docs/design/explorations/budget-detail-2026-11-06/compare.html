<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CheckLine · 预算详情浅深对照</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #172b3c; background: #edf1f5; font: 15px/1.6 -apple-system, BlinkMacSystemFont, sans-serif; }
    header, main { width: min(100% - 32px, 830px); margin: auto; }
    header { padding: 26px 0 18px; }
    h1 { font-size: 25px; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: #475a6d; }
    nav { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; }
    nav button, select { font: inherit; padding: 7px 10px; border: 1px solid #bccbd7; border-radius: 9px; background: white; color: inherit; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 390px)); justify-content: space-between; gap: 20px; padding-bottom: 28px; }
    section header { width: 100%; padding: 0 3px 6px; display: flex; align-items: center; justify-content: space-between; }
    h2 { font-size: 16px; margin: 0; }
    a { color: #286284; text-underline-offset: 3px; }
    iframe { width: 100%; height: 844px; display: block; border: 0; border-radius: 28px; background: white; box-shadow: 0 12px 24px -15px #172b3c70; }
    .dark iframe { background: #10151c; }
    @media (max-width: 680px) { main { grid-template-columns: minmax(0, 390px); justify-content: center; } }
  </style>
</head>
<body>
  <header>
    <h1>预算详情 · 浅深对照</h1>
    <p>点首页的「这个月」，上拉或点拉手展开，滚动收卡，再点一笔消费并返回。浏览器样稿使用示例数据。</p>
    <nav aria-label="样稿选项">
      <label>起始页面 <select id="start"><option value="home">预算首页</option><option value="detail">预算详情</option></select></label>
      <label><input id="reduce" type="checkbox">减少动态效果</label>
      <button id="reset" type="button">重置示例</button>
    </nav>
  </header>
  <main>
    <section data-theme="light"><header><h2>浅色</h2><a target="_blank" rel="noopener">单独打开</a></header><iframe title="浅色预算详情样稿"></iframe></section>
    <section class="dark" data-theme="dark"><header><h2>深色</h2><a target="_blank" rel="noopener">单独打开</a></header><iframe title="深色预算详情样稿"></iframe></section>
  </main>
  <script>
    const start = document.querySelector('#start');
    const reduce = document.querySelector('#reduce');
    function render() {
      for (const section of document.querySelectorAll('[data-theme]')) {
        const params = new URLSearchParams({ theme: section.dataset.theme, view: start.value });
        if (reduce.checked) params.set('reduce', '1');
        const url = './index.html?' + params;
        section.querySelector('iframe').src = url;
        section.querySelector('a').href = url;
      }
    }
    start.addEventListener('change', render);
    reduce.addEventListener('change', render);
    document.querySelector('#reset').addEventListener('click', render);
    render();
  </script>
</body>
</html>
