<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="CheckLine 冰蓝预算主卡浅暗材质对照，仅独立 HTML 视觉样稿。">
<title>预算主卡 · R3 浅暗材质对照</title>
<style>
:root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; color: #1c2c38; background: #edf0f3; font-synthesis: none; }
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 1088px; padding: 38px 32px 30px; margin: auto; }
.study-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
.eyebrow { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .15em; color: #617481; }
h1 { margin: 0; font-size: clamp(23px, 3.4vw, 30px); line-height: 1.3; font-weight: 600; letter-spacing: -.035em; }
.scope { margin: 0 0 3px; font-size: 12px; color: #60717d; white-space: nowrap; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 20px; }
.mode { overflow: hidden; border-radius: 24px; background: var(--ground); border: 1px solid var(--panel-edge); color: var(--panel-ink); }
.light {
  color-scheme: light;
  --ground: #f9fbfd; --panel-edge: #dde5eb; --panel-ink: #183443; --panel-secondary: #5e7381;
  --ice: #37b9e8; --ice-alpha: .28;
  --rear-tint: #70c8e7; --rear-alpha: .42; --far-alpha: .25;
  --rear-inside: .28; --far-inside: .11;
  --reflection: #ffffff; --reflection-top: .78; --reflection-mid: .20;
  --water-top: #37b9e8; --water-mid: #37b9e8; --water-base: #37b9e8;
  --water-top-alpha: .16; --water-mid-alpha: .22; --water-base-alpha: .28;
  --water-scatter: .20; --surface-white: .32; --surface-blue: .18;
  --rim-top: 1; --rim-mid: .72; --rim-bottom: .78; --rim-deep: .18;
  --edge-white: .86; --edge-blue: .30;
  --ink: #12384b; --meta-ink: #27526a; --amount-ink: #103d52; --water-label: #27526a;
  --contact: #183c50; --shadow-alpha: .16; --contact-alpha: .21;
  --pocket-top: #f7fcff; --pocket-base: #dcebf2; --pocket-alpha: .56; --pocket-rim: #ffffff;
  --button-fill: .20; --bubble-near: .94;
}
.dark {
  color-scheme: dark;
  --ground: #0c1117; --panel-edge: #222d37; --panel-ink: #e4f0f7; --panel-secondary: #8e9daa;
  --ice: #37b9e8; --ice-alpha: .78;
  --rear-tint: #70c8e7; --rear-alpha: .55; --far-alpha: .32;
  --rear-inside: .64; --far-inside: .18;
  --reflection: #f4fcff; --reflection-top: .76; --reflection-mid: .22;
  --water-top: #86e2ff; --water-mid: #0b4c74; --water-base: #103e58;
  --water-top-alpha: .20; --water-mid-alpha: .64; --water-base-alpha: .75;
  --water-scatter: .18; --surface-white: .28; --surface-blue: .26;
  --rim-top: 1; --rim-mid: .66; --rim-bottom: .52; --rim-deep: .17;
  --edge-white: .84; --edge-blue: .48;
  --ink: #0c2b3e; --meta-ink: #0d3549; --amount-ink: #ffffff; --water-label: #ffffff;
  --contact: #000000; --shadow-alpha: .55; --contact-alpha: .70;
  --pocket-top: #536879; --pocket-base: #18212b; --pocket-alpha: .35; --pocket-rim: #d5eeff;
  --button-fill: .15; --bubble-near: .82;
}
.mode-heading { display: flex; justify-content: space-between; align-items: center; padding: 22px 24px 0; gap: 12px; }
.mode-heading h2 { font-size: 15px; font-weight: 550; margin: 0; }
.mode-heading span { font-size: 11px; letter-spacing: .08em; color: var(--panel-secondary); }
.card-scene { margin: 0; padding: 0 12px; }
.card-scene svg { display: block; width: 100%; height: auto; overflow: visible; font-family: inherit; }
.card-title { font-size: 24px; font-weight: 600; fill: var(--ink); letter-spacing: -.4px; }
.card-meta { font-size: 11.5px; fill: var(--meta-ink); }
.card-amount { font-size: 44px; font-weight: 500; fill: var(--amount-ink); letter-spacing: -1.8px; font-variant-numeric: tabular-nums; }
.card-label { font-size: 11.5px; fill: var(--water-label); }
.mode-note { margin: 0; padding: 0 24px 23px; color: var(--panel-secondary); font-size: 12px; line-height: 1.6; }
.study-controls { margin-top: 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.light-control { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #425966; min-height: 44px; }
input[type=range] { accent-color: #239bc9; width: 148px; height: 26px; margin: 0; cursor: ew-resize; }
input:focus-visible,button:focus-visible,a:focus-visible { outline: 2px solid #1687b4; outline-offset: 5px; }
button { color: #3c5667; background: transparent; border: 1px solid #cdd7df; border-radius: 8px; min-height: 44px; padding: 6px 11px; font: inherit; font-size: 12px; cursor: pointer; }
button:hover { background: #fff; }
.study-controls p { margin: 0 0 0 auto; color: #687b88; font-size: 11px; }
footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 18px; border-top: 1px solid #d6dfe5; padding-top: 16px; color: #667b88; font-size: 11px; line-height: 1.6; }
footer p { margin: 0; }
footer a { color: #426a82; text-decoration-thickness: 1px; text-underline-offset: 3px; }
@media(max-width: 720px) {
  main { padding: 26px 16px; max-width: 510px; }
  .study-header { display: block; margin-bottom: 20px; }
  .scope { margin: 10px 0 0; }
  .pair { grid-template-columns: minmax(0,1fr); gap: 18px; }
  .card-scene { padding: 0; margin-inline: -12px; }
  .mode-heading { padding: 20px 22px 0; }
  .study-controls { gap: 8px 16px; }
  .study-controls p { flex-basis: 100%; margin: 0; }
  .mode-note { padding-inline: 22px; }
}
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior: auto !important; } }
</style>
</head>

<main>
  <header class="study-header">
    <div><p class="eyebrow">CHECKLINE · R3 MATERIAL</p><h1>预算主卡 · 浅暗对照</h1></div>
    <p class="scope">同一冰蓝材质，适配两种环境</p>
  </header>
  <div class="pair" id="budget-card-pair">
<section class="mode light" aria-labelledby="light-heading">
  <header class="mode-heading"><h2 id="light-heading">浅色</h2><span>LIGHT</span></header>
  <figure class="card-scene" aria-label="浅色预算主卡材质示意：这个月，10月1日至31日，还能花1280元。此处仅展示材质。">
    <!-- Shared R3 geometry and optical layers; each theme supplies its own transmittance and absorption. -->
    <svg viewBox="0 0 432 434" role="img" aria-labelledby="light-title light-desc">
      <title id="light-title">浅色冰蓝柔透玻璃预算主卡</title>
      <desc id="light-desc">冰蓝柔透玻璃透出柔化后卡。局部亮边与内侧暗部表达厚度，液面有前后表面，气泡分远近并有球面反光。文字保持清晰。</desc>
      <defs>
        <radialGradient id="light-reflection" class="moving-light" data-light-inset=".12" cx=".1352" cy=".12" r=".68">
          <stop style="stop-color:var(--reflection);stop-opacity:var(--reflection-top)"/>
          <stop offset=".46" style="stop-color:var(--reflection);stop-opacity:var(--reflection-mid)"/>
          <stop offset=".76" style="stop-color:var(--reflection);stop-opacity:.015"/>
          <stop offset="1" style="stop-color:var(--reflection);stop-opacity:0"/>
        </radialGradient>
        <radialGradient id="light-edge-sweep" class="moving-light" data-light-inset=".10" cx=".116" cy=".04" r=".76">
          <stop stop-color="#fff" stop-opacity="1"/><stop offset=".42" stop-color="#fff" stop-opacity=".78"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="light-liquid" x1="0" y1="0" x2="0" y2="1">
          <stop style="stop-color:var(--water-top);stop-opacity:var(--water-top-alpha)"/>
          <stop offset=".33" style="stop-color:var(--water-mid);stop-opacity:var(--water-mid-alpha)"/>
          <stop offset="1" style="stop-color:var(--water-base);stop-opacity:var(--water-base-alpha)"/>
        </linearGradient>
        <linearGradient id="light-surface" x1="0" y1="0" x2=".15" y2="1">
          <stop stop-color="#fff" style="stop-opacity:var(--surface-white)"/><stop offset="1" stop-color="#37b9e8" style="stop-opacity:var(--surface-blue)"/>
        </linearGradient>
        <radialGradient id="light-scatter" cx=".5" cy=".5" r=".5">
          <stop stop-color="#fff" style="stop-opacity:var(--water-scatter)"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="light-rim" class="directional-rim" x1=".02" y1="0" x2=".98" y2="1">
          <stop stop-color="#fff" style="stop-opacity:var(--rim-top)"/>
          <stop offset=".28" stop-color="#fff" style="stop-opacity:var(--rim-mid)"/>
          <stop offset=".62" stop-color="#4295b5" style="stop-opacity:var(--rim-deep)"/>
          <stop offset="1" stop-color="#fff" style="stop-opacity:var(--rim-bottom)"/>
        </linearGradient>
        <!-- An almost clear centre and a thin reflected edge avoid a shaded, raised bead. -->
        <radialGradient id="light-bubble-fill" cx=".5" cy=".5" r=".5">
          <stop stop-color="#fff" stop-opacity="0"/><stop offset=".64" stop-color="#fff" stop-opacity=".015"/><stop offset=".82" stop-color="#fff" stop-opacity=".11"/><stop offset=".94" stop-color="#fff" stop-opacity=".23"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/>
        </radialGradient>
        <linearGradient id="light-pocket" x1="0" y1="0" x2="0" y2="1">
          <stop style="stop-color:var(--pocket-top);stop-opacity:var(--pocket-alpha)"/><stop offset="1" style="stop-color:var(--pocket-base);stop-opacity:0"/>
        </linearGradient>
        <filter id="light-shadow" filterUnits="userSpaceOnUse" x="4" y="52" width="424" height="362">
          <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/><feOffset in="blur" dy="8" result="cast"/>
          <feComposite in="cast" in2="SourceAlpha" operator="out" result="outside"/>
          <feFlood style="flood-color:var(--contact);flood-opacity:var(--shadow-alpha)" result="shade"/><feComposite in="shade" in2="outside" operator="in"/>
        </filter>
        <filter id="light-soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5.5"/></filter>
        <filter id="light-thickness" filterUnits="userSpaceOnUse" x="34" y="70" width="364" height="312" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="softEdge"/>
          <feOffset in="softEdge" dx="1.728" dy="2.6" data-edge-x="1.8" result="insetLight"/>
          <feComposite in="SourceAlpha" in2="insetLight" operator="out" result="lightEdge"/>
          <feFlood flood-color="#fff" style="flood-opacity:var(--edge-white)" result="white"/><feComposite in="white" in2="lightEdge" operator="in" result="lightRim"/>
          <feOffset in="softEdge" dx="-1.728" dy="-2.6" data-edge-x="-1.8" result="insetShade"/>
          <feComposite in="SourceAlpha" in2="insetShade" operator="out" result="shadeEdge"/>
          <feFlood flood-color="#216e91" style="flood-opacity:var(--edge-blue)" result="blue"/><feComposite in="blue" in2="shadeEdge" operator="in" result="shadeRim"/>
          <feMerge><feMergeNode in="shadeRim"/><feMergeNode in="lightRim"/></feMerge>
        </filter>
        <filter id="light-glint-soft" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="1.5"/></filter>
        <filter id="light-contact" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
        <clipPath id="light-card"><rect x="40" y="76" width="352" height="300" rx="32"/></clipPath>
        <clipPath id="light-rear-top"><rect width="432" height="76"/></clipPath>
        <clipPath id="light-liquid-clip"><path d="M40 233C94 220 133 240 190 231S294 220 345 231S382 231 392 227V381H40Z"/></clipPath>

</main>
<script>
(() => {
  const input = document.querySelector('#light-position');
  const reflections = document.querySelectorAll('.moving-light');
  const rims = document.querySelectorAll('.directional-rim');
  const offsets = document.querySelectorAll('[data-edge-x]');
  const glints = document.querySelectorAll('.bubble-glint');
  const caustics = document.querySelectorAll('.liquid-caustic');
  const edges = document.querySelectorAll('.key-edge');
  function applyLight() {
    const x = Number(input.value) / 100;
    input.setAttribute('aria-valuetext', x < .3 ? '左上受光' : x > .7 ? '右上受光' : '上方受光');
    reflections.forEach(light => {
      const inset = Number(light.dataset.lightInset || 0);
      light.setAttribute('cx', (inset + x * (1 - inset * 2)).toFixed(4));
    });
    rims.forEach(rim => {
      rim.setAttribute('x1', x.toFixed(4));
      rim.setAttribute('x2', (1 - x).toFixed(4));
    });
    offsets.forEach(offset => offset.setAttribute('dx', (Number(offset.dataset.edgeX) * (1 - x * 2)).toFixed(3)));
    glints.forEach(glint => glint.setAttribute('transform', 'rotate(' + (90 * x).toFixed(2) + ')'));
    caustics.forEach(caustic => caustic.setAttribute('cx', (40 + 352 * (.16 + .68 * x)).toFixed(2)));
    edges.forEach(edge => edge.setAttribute('opacity', String(.85 + Math.abs(x - .5) * .3)));
  }
  input.addEventListener('input', applyLight);
  document.querySelector('#reset-light').addEventListener('click', () => {
    input.value = '2';
    applyLight();
  });
  applyLight();
})();
</script>
