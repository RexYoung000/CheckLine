<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="CheckLine 冰蓝预算主卡浅暗材质对照，仅独立 HTML 视觉样稿。">
<title>预算主卡 · R3 浅暗材质对照</title>
<style>
:root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; color: #1c2c38; background: #edf0f3; font-synthesis: none; }
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 1088px; padding: 38px 32px 30px; margin: auto; }
.study-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
.eyebrow { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .15em; color: #617481; }
h1 { margin: 0; font-size: clamp(23px, 3.4vw, 30px); line-height: 1.3; font-weight: 600; letter-spacing: -.035em; }
.scope { margin: 0 0 3px; font-size: 12px; color: #60717d; white-space: nowrap; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 20px; }
.mode { overflow: hidden; border-radius: 24px; background: var(--ground); border: 1px solid var(--panel-edge); color: var(--panel-ink); }
.light {
  color-scheme: light;
  --ground: #f9fbfd; --panel-edge: #dde5eb; --panel-ink: #183443; --panel-secondary: #5e7381;
  --body-top: #63c9ef; --body-mid: #37b9e8; --body-base: #125c85;
  --body-top-alpha: .65; --body-mid-alpha: .78; --body-base-alpha: .94;
  --rear-top: #a4e2f7; --rear-base: #69b9d9; --rear-alpha: .52; --far-alpha: .42;
  --reflection: #ffffff; --reflection-top: .66; --reflection-mid: .12;
  --face-top: .26; --face-mid: .08; --face-low: .015;
  --water-top: #c5f1ff; --water-mid: #09527c; --water-base: #073953;
  --water-top-alpha: .20; --water-mid-alpha: .54; --water-base-alpha: .62;
  --rim-top: .98; --rim-mid: .52; --rim-bottom: .30; --rim-deep: .10;
  --ink: #12384b; --meta-ink: #27526a; --amount-ink: #ffffff; --water-label: #f3fbff;
  --contact: #16465c; --shadow-alpha: .20; --contact-alpha: .25;
  --pocket-top: #f7fcff; --pocket-base: #dcebf2; --pocket-alpha: .56; --pocket-rim: #ffffff;
  --button-fill: .12; --bubble-alpha: .35;
}
.dark {
  color-scheme: dark;
  --ground: #0c1117; --panel-edge: #222d37; --panel-ink: #e4f0f7; --panel-secondary: #8e9daa;
  --body-top: #73d0f1; --body-mid: #37b9e8; --body-base: #0c4f78;
  --body-top-alpha: .96; --body-mid-alpha: .94; --body-base-alpha: .96;
  --rear-top: #71d0f2; --rear-base: #266185; --rear-alpha: .55; --far-alpha: .32;
  --reflection: #f2fcff; --reflection-top: .55; --reflection-mid: .10;
  --face-top: .23; --face-mid: .065; --face-low: .025;
  --water-top: #a8e5fb; --water-mid: #09527c; --water-base: #082f4c;
  --water-top-alpha: .17; --water-mid-alpha: .42; --water-base-alpha: .56;
  --rim-top: .90; --rim-mid: .44; --rim-bottom: .28; --rim-deep: .11;
  --ink: #0e3044; --meta-ink: #1c4b63; --amount-ink: #ffffff; --water-label: #effaff;
  --contact: #000000; --shadow-alpha: .50; --contact-alpha: .70;
  --pocket-top: #536879; --pocket-base: #18212b; --pocket-alpha: .35; --pocket-rim: #d5eeff;
  --button-fill: .13; --bubble-alpha: .38;
}
.mode-heading { display: flex; justify-content: space-between; align-items: center; padding: 22px 24px 0; gap: 12px; }
.mode-heading h2 { font-size: 15px; font-weight: 550; margin: 0; }
.mode-heading span { font-size: 11px; letter-spacing: .08em; color: var(--panel-secondary); }
.card-scene { margin: 0; padding: 0 12px; }
.card-scene svg { display: block; width: 100%; height: auto; overflow: visible; font-family: inherit; }
.card-title { font-size: 24px; font-weight: 600; fill: var(--ink); letter-spacing: -.4px; }
.card-meta { font-size: 11.5px; fill: var(--meta-ink); }
.card-amount { font-size: 44px; font-weight: 500; fill: var(--amount-ink); letter-spacing: -1.8px; font-variant-numeric: tabular-nums; }
.card-label { font-size: 11.5px; fill: var(--water-label); }
.mode-note { margin: 0; padding: 0 24px 23px; color: var(--panel-secondary); font-size: 12px; line-height: 1.6; }
.study-controls { margin-top: 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.light-control { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #425966; min-height: 44px; }
input[type=range] { accent-color: #239bc9; width: 148px; height: 26px; margin: 0; cursor: ew-resize; }
input:focus-visible,button:focus-visible,a:focus-visible { outline: 2px solid #1687b4; outline-offset: 5px; }
button { color: #3c5667; background: transparent; border: 1px solid #cdd7df; border-radius: 8px; min-height: 44px; padding: 6px 11px; font: inherit; font-size: 12px; cursor: pointer; }
button:hover { background: #fff; }
.study-controls p { margin: 0 0 0 auto; color: #687b88; font-size: 11px; }
footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 18px; border-top: 1px solid #d6dfe5; padding-top: 16px; color: #667b88; font-size: 11px; line-height: 1.6; }
footer p { margin: 0; }
footer a { color: #426a82; text-decoration-thickness: 1px; text-underline-offset: 3px; }
@media(max-width: 720px) {
  main { padding: 26px 16px; max-width: 510px; }
  .study-header { display: block; margin-bottom: 20px; }
  .scope { margin: 10px 0 0; }
  .pair { grid-template-columns: minmax(0,1fr); gap: 18px; }
  .card-scene { padding: 0; margin-inline: -12px; }
  .mode-heading { padding: 20px 22px 0; }
  .study-controls { gap: 8px 16px; }
  .study-controls p { flex-basis: 100%; margin: 0; }
  .mode-note { padding-inline: 22px; }
}
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<main>
  <header class="study-header">
    <div><p class="eyebrow">CHECKLINE · R3 MATERIAL</p><h1>预算主卡 · 浅暗对照</h1></div>
    <p class="scope">同一冰蓝材质，适配两种环境</p>
  </header>
  <div class="pair" id="budget-card-pair">
<section class="mode light" aria-labelledby="light-heading">
  <header class="mode-heading"><h2 id="light-heading">浅色</h2><span>LIGHT</span></header>
  <figure class="card-scene" aria-label="浅色预算主卡材质示意：这个月，10月1日至31日，还能花1280元。此处仅展示材质。">
    <!-- R3 geometry: front 352 × 300, radius 32; continuous water, softened rear silhouette, one rim. -->
    <svg viewBox="0 0 432 434" role="img" aria-labelledby="light-title light-desc">
      <title id="light-title">浅色冰蓝预算主卡</title>
      <desc id="light-desc">两层后卡透入玻璃，局部白色反光与冰蓝液体叠加。下缘由一片连续卡夹承托。</desc>
      <defs>
        <linearGradient id="light-body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--body-top);stop-opacity:var(--body-top-alpha)"/>
          <stop offset=".45" style="stop-color:var(--body-mid);stop-opacity:var(--body-mid-alpha)"/>
          <stop offset="1" style="stop-color:var(--body-base);stop-opacity:var(--body-base-alpha)"/>
        </linearGradient>
        <linearGradient id="light-rear" x1="0" y1="0" x2=".35" y2="1">
          <stop style="stop-color:var(--rear-top)"/><stop offset="1" style="stop-color:var(--rear-base)"/>
        </linearGradient>
        <linearGradient id="light-glass" x1="0" y1="0" x2=".58" y2="1">
          <stop stop-color="#fff" style="stop-opacity:var(--face-top)"/>
          <stop offset=".35" stop-color="#fff" style="stop-opacity:var(--face-mid)"/>
          <stop offset="1" stop-color="#fff" style="stop-opacity:var(--face-low)"/>
        </linearGradient>
        <radialGradient id="light-reflection" class="moving-light" cx=".02" cy=".015" r=".94">
          <stop style="stop-color:var(--reflection);stop-opacity:var(--reflection-top)"/>
          <stop offset=".58" style="stop-color:var(--reflection);stop-opacity:var(--reflection-mid)"/>
          <stop offset="1" style="stop-color:var(--reflection);stop-opacity:0"/>
        </radialGradient>
        <radialGradient id="light-bloom" cx=".06" cy="0" r=".8">
          <stop stop-color="#d1f4ff" stop-opacity=".18"/>
          <stop offset="1" stop-color="#d1f4ff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="light-liquid" x1="0" y1="0" x2="0" y2="1">
          <stop style="stop-color:var(--water-top);stop-opacity:var(--water-top-alpha)"/>
          <stop offset=".33" style="stop-color:var(--water-mid);stop-opacity:var(--water-mid-alpha)"/>
          <stop offset="1" style="stop-color:var(--water-base);stop-opacity:var(--water-base-alpha)"/>
        </linearGradient>
        <linearGradient id="light-rim" x1="0" y1="0" x2=".8" y2="1">
          <stop stop-color="#fff" style="stop-opacity:var(--rim-top)"/>
          <stop offset=".28" stop-color="#fff" style="stop-opacity:var(--rim-mid)"/>
          <stop offset=".62" stop-color="#c5f1ff" style="stop-opacity:var(--rim-deep)"/>
          <stop offset="1" stop-color="#fff" style="stop-opacity:var(--rim-bottom)"/>
        </linearGradient>
        <linearGradient id="light-pocket" x1="0" y1="0" x2="0" y2="1">
          <stop style="stop-color:var(--pocket-top);stop-opacity:var(--pocket-alpha)"/>
          <stop offset="1" style="stop-color:var(--pocket-base);stop-opacity:0"/>
        </linearGradient>
        <filter id="light-shadow" filterUnits="userSpaceOnUse" x="4" y="52" width="424" height="362">
          <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
          <feOffset in="blur" dy="13" result="cast"/>
          <feComposite in="cast" in2="SourceAlpha" operator="out" result="outside"/>
          <feFlood style="flood-color:var(--contact);flood-opacity:var(--shadow-alpha)" result="shade"/>
          <feComposite in="shade" in2="outside" operator="in"/>
        </filter>
        <filter id="light-soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.8"/></filter>
        <filter id="light-contact" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
        <clipPath id="light-card"><rect x="40" y="76" width="352" height="300" rx="32"/></clipPath>
        <clipPath id="light-rear-top"><rect width="432" height="76"/></clipPath>
      </defs>
      <!-- Rear planes remain physical silhouettes under the translucent front, not extra front rims. -->
      <g clip-path="url(#light-rear-top)">
        <rect x="79" y="38" width="274" height="278" rx="29" fill="url(#light-rear)" style="opacity:var(--far-alpha)"/>
        <rect x="79.5" y="38.5" width="273" height="277" rx="28.5" fill="none" stroke="#e0f6ff" stroke-opacity=".28"/>
        <rect x="62" y="54" width="308" height="288" rx="30" fill="url(#light-rear)" style="opacity:var(--rear-alpha)"/>
        <rect x="62.5" y="54.5" width="307" height="287" rx="29.5" fill="none" stroke="#e6f8ff" stroke-opacity=".38"/>
      </g>
      <rect x="40" y="76" width="352" height="300" rx="32" fill="#000" filter="url(#light-shadow)"/>
      <g clip-path="url(#light-card)">
        <!-- This rear tint stays visible through the front's alpha and softens at the boundary. -->
        <rect x="62" y="54" width="308" height="288" rx="30" fill="url(#light-rear)" fill-opacity=".18" filter="url(#light-soft)"/>
        <rect x="40" y="76" width="352" height="300" fill="url(#light-body)"/>
        <rect x="40" y="76" width="352" height="300" fill="url(#light-glass)"/>
        <rect x="40" y="76" width="352" height="300" fill="url(#light-reflection)"/>
        <ellipse cx="397" cy="121" rx="150" ry="246" fill="url(#light-bloom)"/>
        <path d="M40 233C94 220 133 240 190 231S294 220 345 231S382 231 392 227V381H40Z" fill="url(#light-liquid)"/>
        <path d="M40 234C94 221 133 241 190 232S294 221 345 232S382 232 392 228" fill="none" stroke="#d3f4ff" stroke-opacity=".36" stroke-width="1.05"/>
        <g fill="#fff" fill-opacity=".015" stroke="#e5f8ff" style="stroke-opacity:var(--bubble-alpha)" stroke-width=".75">
          <circle cx="65" cy="324" r="2"/><circle cx="87" cy="283" r="2.9"/>
          <circle cx="102" cy="355" r="1.7"/><circle cx="127" cy="306" r="2.1"/>
          <circle cx="149" cy="260" r="1.4"/><circle cx="163" cy="349" r="3.4"/>
          <circle cx="197" cy="315" r="1.4"/><circle cx="218" cy="268" r="1.8"/>
          <circle cx="245" cy="356" r="2.2"/><circle cx="280" cy="287" r="1.3"/>
          <circle cx="305" cy="335" r="2.5"/><circle cx="335" cy="261" r="1.5"/>
          <circle cx="363" cy="312" r="2"/><circle cx="380" cy="355" r="1.3"/>
        </g>
      </g>
      <rect x="40.6" y="76.6" width="350.8" height="298.8" rx="31.4" fill="none" stroke="url(#light-rim)" stroke-width="1.2"/>
      <path class="key-edge" d="M40.8 113V109Q40.8 76.8 72.8 76.8H316" fill="none" stroke="#fff" stroke-opacity=".56" stroke-width="1.1" stroke-linecap="round"/>
      <text x="62" y="122" class="card-title">这个月</text>
      <text x="62" y="148" class="card-meta">10月1日—10月31日 · CNY</text>
      <g fill="none" stroke="#28586e" stroke-width="1.6" stroke-linecap="round" opacity=".66" aria-hidden="true">
        <circle cx="350" cy="113" r="1.05" fill="currentColor" stroke="none" style="color:var(--meta-ink)"/>
        <circle cx="357" cy="113" r="1.05" fill="currentColor" stroke="none" style="color:var(--meta-ink)"/>
        <circle cx="364" cy="113" r="1.05" fill="currentColor" stroke="none" style="color:var(--meta-ink)"/>
      </g>
      <text x="367" y="288" class="card-label" text-anchor="end">还能花</text>
      <text x="367" y="338" class="card-amount" text-anchor="end">¥1,280</text>
      <circle cx="84" cy="315" r="24" fill="#fff" style="fill-opacity:var(--button-fill)" stroke="#e5f8ff" stroke-opacity=".53" stroke-width="1"/>
      <path d="M74 315h20M84 305v20" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      <!-- One continuous foreground lip; no full-width rectangular seam. -->
      <ellipse cx="216" cy="382" rx="148" ry="3.3" style="fill:var(--contact);opacity:var(--contact-alpha)" filter="url(#light-contact)"/>
      <path d="M14 344C32 344 46 377 77 380H355C386 377 400 344 418 344V416H14Z" fill="url(#light-pocket)"/>
      <path d="M14 345C32 345 46 378 77 381H355C386 378 400 345 418 345" fill="none" style="stroke:var(--pocket-rim)" stroke-opacity=".28" stroke-width="1"/>
    </svg>
  </figure>
  <p class="mode-note">白色承托 · 柔和透光 · 清晰的层间阴影</p>
</section>

<script>
(() => {
  const input = document.querySelector('#light-position');
  const reflections = document.querySelectorAll('.moving-light');
  const edges = document.querySelectorAll('.key-edge');
  function applyLight() {
    const x = Number(input.value) / 100;
    input.setAttribute('aria-valuetext', x < .3 ? '左上受光' : x > .7 ? '右上受光' : '上方受光');
    reflections.forEach(light => light.setAttribute('cx', x.toFixed(2)));
    edges.forEach(edge => {
      edge.setAttribute('transform', x > .5 ? 'translate(432 0) scale(-1 1)' : '');
      edge.setAttribute('stroke-opacity', String(.32 + Math.abs(x - .5) * .5));
    });
  }
  input.addEventListener('input', applyLight);
  document.querySelector('#reset-light').addEventListener('click', () => {
    input.value = '2';
    applyLight();
  });
  applyLight();
})();
</script>
