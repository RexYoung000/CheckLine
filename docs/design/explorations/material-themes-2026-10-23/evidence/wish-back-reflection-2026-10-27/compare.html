<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心愿背面 · 高光修正</title><style>*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#24262a;font:15px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1320px;margin:auto;padding:28px 24px}h1{font-size:25px}p{color:#505960}a{color:#255a70;text-underline-offset:4px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}figure{margin:0;border:1px solid #dce1e4;background:#fafbfc;border-radius:16px;overflow:hidden}figcaption{padding:14px 18px}img{width:100%;display:block}a:focus-visible{outline:2px solid #2789b3;outline-offset:4px}@media(max-width:760px){.pair{grid-template-columns:1fr}}</style></head><body><main><h1>心愿背面 · 高光修正</h1><p>去掉背面中央有实体轮廓的斜向高光条，保留上沿反射、下沿回光、冰蓝玻璃边与内卡环境倒影。每张图左侧浅色、右侧暗色。</p><p><a href="../../budget-pages-pair.html?view=wish-back&study=back-glare-10">打开浅暗交互稿</a></p><div class="pair"><figure><figcaption>修改前 · 反光条看起来像斜柱</figcaption><a href="before.jpg"><img src="before.jpg" alt="背面高光修正前，左浅右暗"></a></figure><figure><figcaption>修改后 · 取消独立条状物，保留边缘与环境反射</figcaption><a href="after.jpg"><img src="after.jpg" alt="背面高光修正后，左浅右暗"></a></figure></div><p>浅暗背面翻转与 50% 兑换禁用已检查。正面反射保留，全部 JavaScript 与 032acc8 一致；本轮只修改背面样式，未重跑全页面测试，原生 App 未改。<a href="checks.json">验证记录</a>。最终反光强度待 Rex 验收。</p></main></body></html>
