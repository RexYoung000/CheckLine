<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暗色未实现心愿 · 银灰内卡</title><style>*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#24262a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:980px;margin:auto;padding:34px 30px}h1{font-size:27px;font-weight:600;letter-spacing:-.5px;margin:0 0 10px}p{font-size:14px;line-height:1.7;color:#676a72;margin:0}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:18px;margin:23px 0 26px}.switch{display:flex;background:#ebebee;padding:4px;border-radius:12px}button{border:0;background:transparent;color:#5b5d65;font:inherit;font-size:13px;padding:11px 17px;min-height:44px;border-radius:9px;cursor:pointer}button[aria-pressed=true]{background:#25262a;color:#fff}a{font-size:13px;color:#4a6170;text-underline-offset:4px}button:focus-visible,a:focus-visible{outline:2px solid #417a94;outline-offset:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}figure{margin:0}h2{font-size:18px;font-weight:600;margin:0 0 8px}.meta{font-size:12px;color:#8a8c92;margin-bottom:15px}.stage{padding:32px 24px;background:#f4f4f4;display:flex;justify-content:center;align-items:center;min-height:414px}.stage img{width:100%;max-width:346px;height:auto;display:block}.stage a{display:block}.dark .stage{background:#090909}figcaption{margin-top:16px;font-size:14px;line-height:1.7;color:#54575e}.note{margin-top:28px;padding-top:20px;border-top:1px solid #dddfe3}footer{margin-top:22px;font-size:11px;color:#878991;line-height:1.6}@media(max-width:670px){main{padding:24px 20px}.grid{grid-template-columns:1fr;gap:28px;max-width:420px;margin:auto}h1{font-size:24px}.stage{min-height:360px;padding:24px 16px}}</style></head>
<body class="dark"><main>
<h1>暗色未实现心愿 · 银灰内卡</h1>
<p>同一张心愿卡、相同尺寸与静止姿态。外层冰蓝玻璃保持，内部卡片与图标底座改为冷调银灰。</p>
<div class="toolbar"><div class="switch" role="group" aria-label="对照主题"><button id="dark" aria-pressed="true">暗色 · 本轮调整</button><button id="light" aria-pressed="false">浅色 · 保持</button></div><a href="../../budget-pages-pair.html?view=wish&study=dark-inner-metal-7" target="_blank" rel="noreferrer">打开浅暗交互稿</a></div>
<section class="grid" aria-label="修改前后卡面">
<figure><h2>修改前</h2><p class="meta" id="before-meta">9bb5fc1 · 冰蓝内卡与图标底座</p><div class="stage"><a id="before-link" href="before-dark.jpg" target="_blank" rel="noreferrer"><img id="before-image" src="before-dark.jpg" alt="修改前暗色未实现心愿卡"></a></div><figcaption id="before-note">内部底片和图标底座同为冰蓝，与外层玻璃接近。</figcaption></figure>
<figure><h2>修改后</h2><p class="meta" id="after-meta">本轮 · 原玻璃包裹银灰金属</p><div class="stage"><a id="after-link" href="after-dark.jpg" target="_blank" rel="noreferrer"><img id="after-image" src="after-dark.jpg" alt="修改后暗色未实现心愿卡"></a></div><figcaption id="after-note">透过原玻璃看见银灰金属与局部环境倒影；底座、图标和文字同步明度，与兑换后的收藏卡呼应。</figcaption></figure>
</section>
<p class="note">只调整暗色未实现心愿卡正面的内部材质，覆盖小卡、横卡与放大卡。外层玻璃、浅色、已实现卡和现有翻面／破壳保持；其他页面与原生 App 未改。</p>
<div class="toolbar"><a href="grid-before-after.jpg" target="_blank" rel="noreferrer">查看清单前后对照</a><a href="redemption-finish.jpg" target="_blank" rel="noreferrer">查看破壳后的收藏卡</a></div>
<footer>隔离示例实际渲染截图，未修图。浅色未实现卡、暗色已实现卡同姿态截图逐像素一致。最终玻璃与金属的观感待 Rex 验收。</footer>
</main><script>
const copy={dark:['9bb5fc1 · 冰蓝内卡与图标底座','本轮 · 原玻璃包裹银灰金属','内部底片和图标底座同为冰蓝，与外层玻璃接近。','透过原玻璃看见银灰金属与局部环境倒影；底座、图标和文字同步明度，与兑换后的收藏卡呼应。'],light:['9bb5fc1 · 浅色基线','本轮 · 浅色保持','浅色未实现心愿卡，保留原冰蓝玻璃和内卡。','浅色未接入新的内部金属层，同姿态卡面逐像素一致。']};
for(const theme of ['dark','light'])document.getElementById(theme).addEventListener('click',()=>{document.body.classList.toggle('dark',theme==='dark');for(const t of ['dark','light'])document.getElementById(t).setAttribute('aria-pressed',String(t===theme));for(const [i,id] of ['before','after'].entries()){document.getElementById(id+'-image').src=id+'-'+theme+'.jpg';document.getElementById(id+'-image').alt=(i?'修改后':'修改前')+(theme==='dark'?'暗色':'浅色')+'未实现心愿卡';document.getElementById(id+'-link').href=id+'-'+theme+'.jpg';document.getElementById(id+'-meta').textContent=copy[theme][i];document.getElementById(id+'-note').textContent=copy[theme][i+2];}});
</script></body></html>
