<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>浅色收藏金属 · 修改前后</title><style>*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#24262a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:980px;margin:auto;padding:34px 30px}h1{font-size:27px;font-weight:600;letter-spacing:-.5px;margin:0 0 10px}p{font-size:14px;line-height:1.7;color:#676a72;margin:0}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:18px;margin:23px 0 26px}.switch{display:flex;background:#ebebee;padding:4px;border-radius:12px}button{border:0;background:transparent;color:#5b5d65;font:inherit;font-size:13px;padding:11px 17px;min-height:44px;border-radius:9px;cursor:pointer}button[aria-pressed=true]{background:#25262a;color:#fff}a{font-size:13px;color:#4a6170;text-underline-offset:4px}button:focus-visible,a:focus-visible{outline:2px solid #417a94;outline-offset:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}figure{margin:0}h2{font-size:18px;font-weight:600;margin:0 0 8px}.meta{font-size:12px;color:#8a8c92;margin-bottom:15px}.stage{padding:32px 24px;background:#f4f4f4;display:flex;justify-content:center;align-items:center;min-height:414px}.stage img{width:100%;max-width:346px;height:auto;display:block}.stage a{display:block}.dark .stage{background:#090909}figcaption{margin-top:16px;font-size:14px;line-height:1.7;color:#54575e}.note{margin-top:28px;padding-top:20px;border-top:1px solid #dddfe3}footer{margin-top:22px;font-size:11px;color:#878991;line-height:1.6}@media(max-width:670px){main{padding:24px 20px}.grid{grid-template-columns:1fr;gap:28px;max-width:420px;margin:auto}h1{font-size:24px}.stage{min-height:360px;padding:24px 16px}}</style></head><body><main><h1>浅色收藏金属 · 修改前后</h1><p>同一张已实现心愿卡、相同尺寸与静止姿态。保留冰蓝色源，调整环境暗影与表面高光的分布。</p><div class="toolbar"><div class="switch" role="group" aria-label="对照主题"><button id="light" aria-pressed="true">浅色 · 本轮调整</button><button id="dark" aria-pressed="false">暗色 · 保持</button></div><a href="../../budget-pages-pair.html?view=wish&collection=done&study=light-clean-metal-5" target="_blank" rel="noreferrer">打开当前交互稿</a></div><section class="grid" aria-label="修改前后卡面"><figure><h2>修改前</h2><p class="meta">e597a63 · 宽灰影与局部反光</p><div class="stage"><a id="before-link" href="before-light.jpg" target="_blank" rel="noreferrer"><img id="before-image" src="before-light.jpg" alt="修改前浅色金属收藏卡"></a></div><figcaption id="before-note">多处宽灰影占据卡面，倒影较重，冰蓝底容易显得发灰。</figcaption></figure><figure><h2>修改后</h2><p class="meta">本轮 · 干净冰蓝底与分层反射</p><div class="stage"><a id="after-link" href="after-light.jpg" target="_blank" rel="noreferrer"><img id="after-image" src="after-light.jpg" alt="修改后浅色金属收藏卡"></a></div><figcaption id="after-note">灰影集中在局部；远处亮窗柔和，表层亮芯更清楚，主要卡面保留干净冰蓝。</figcaption></figure></section><p class="note" id="note">本轮仅调整浅色已实现心愿卡。小卡、横卡、放大卡与兑换后内卡共用；暗色、翻面、破壳、其他页面和原生 App 保持。静态截图用于比较材质，动效请在交互稿中查看。</p><footer>前后均由隔离示例实际渲染，未使用图像生成或修图。最终材质观感待 Rex 验收。</footer></main><script>const copy={light:['多处宽灰影占据卡面，倒影较重，冰蓝底容易显得发灰。','灰影集中在局部；远处亮窗柔和，表层亮芯更清楚，主要卡面保留干净冰蓝。'],dark:['此前确认的灰金属环境倒影。','保留原有灰金属明暗、高光与环境倒影。']};for(const theme of ['light','dark'])document.getElementById(theme).addEventListener('click',()=>{document.body.classList.toggle('dark',theme==='dark');for(const t of ['light','dark'])document.getElementById(t).setAttribute('aria-pressed',String(t===theme));for(const id of ['before','after']){document.getElementById(id+'-image').src=id+'-'+theme+'.jpg';document.getElementById(id+'-image').alt=(id==='before'?'修改前':'修改后')+(theme==='light'?'浅色冰蓝':'暗色灰')+'金属卡';document.getElementById(id+'-link').href=id+'-'+theme+'.jpg';}document.getElementById('before-note').textContent=copy[theme][0];document.getElementById('after-note').textContent=copy[theme][1];});</script></body></html>
