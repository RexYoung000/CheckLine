<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CheckLine · 浅暗主题并排对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eeec;color:#1b3a46;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}header{max-width:1020px;margin:auto;padding:32px 28px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}h1{font-size:24px;font-weight:600;letter-spacing:-.6px;margin:0 0 8px}header p{font-size:13px;color:#5d7882;margin:0;line-height:1.6}.view-control{display:flex;align-items:center;gap:12px;font-size:13px;color:#526f7c}select{padding:12px 14px;color:#17495d;background:#f5faf7b0;border:1px solid #ffffffbf;border-radius:14px;font:inherit;min-width:170px}.comparison{display:grid;grid-template-columns:390px 390px;gap:58px;justify-content:center;padding:0 24px 36px}.theme-label{display:flex;align-items:baseline;justify-content:space-between;padding:0 6px 13px}.theme-label h2{font-size:18px;font-weight:550;margin:0}.theme-label a{color:#456c7d;font-size:12px;text-underline-offset:4px}.frame{border-radius:36px;overflow:hidden;box-shadow:0 20px 50px -24px #163d4d55,0 1px 0 #ffffffc2;border:1px solid #ffffffa8;background:#e6f1ef;width:390px;height:844px}iframe{border:0;width:100%;height:100%;display:block}footer{max-width:880px;margin:0 auto 30px;padding:0 26px;font-size:12px;color:#66818a;line-height:1.8}.review-options{display:flex;align-items:center;gap:24px;font-size:12px;color:#526f7c}.review-options a{color:#285c70;text-underline-offset:4px}.review-options label{display:flex;align-items:center;gap:4px}input{accent-color:#1c6e83}button,a,select,input{outline-offset:4px}a:focus-visible,select:focus-visible{outline:3px solid #258eaa}@media(max-width:900px){.comparison{grid-template-columns:min(390px,calc(100vw - 32px));gap:32px;padding:0 16px 28px}.frame{width:100%;height:min(844px,calc((100vw - 32px)*2.164))}header{padding:25px 20px}.view-control{width:100%;justify-content:space-between}select{flex:1;max-width:250px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

.comparison.home-reference{grid-template-columns:390px 390px 390px;gap:24px}
.reference-only[hidden]{display:none}
.reference-crop{width:390px;height:559.65px;position:relative;overflow:hidden;border-radius:39px}
.reference-crop img{position:absolute;left:-39px;top:-39px;width:468px;height:auto;max-width:none}
.reference-note{color:#66818a;font-size:12px;line-height:1.8;padding:8px 6px;max-width:370px}
body:has(.home-reference) header{max-width:1270px}
@media(max-width:1240px){.comparison.home-reference{grid-template-columns:390px 390px;gap:32px}.reference-only{grid-column:1/-1;display:grid;grid-template-columns:240px 390px;gap:0 32px;align-items:center;justify-content:center}.reference-only .reference-crop{grid-column:2;grid-row:1/3}.reference-only .theme-label{display:block;max-width:240px}.reference-only .theme-label h2{margin-bottom:12px}.reference-note{max-width:240px}}
@media(max-width:900px){.comparison.home-reference{grid-template-columns:min(390px,calc(100vw - 32px))}.reference-only{display:block}.reference-only .theme-label{display:flex;max-width:none}.reference-note{max-width:none}.reference-crop{width:100%;height:auto;aspect-ratio:400/574}.reference-crop img{width:120%;left:-10%;top:-6.97%}}
</style></head>
<body><header><div><h1>R3 透光材质，浅暗两种光照</h1><p>以找回的 R3 为基准；两侧均可操作，页面下拉切换。</p></div><label class="view-control">查看页面<select id="compare-view" aria-label="对照页面"><option value="home">预算首页</option><option value="records">首页全部记录</option><option value="library">预算卡库</option><option value="detail">预算详情</option><option value="record">消费详情</option><option value="trend">消费日历</option><option value="history">历史周期</option><option value="info">预算信息</option><option value="wish">心愿清单</option><option value="wish-back">心愿卡背面</option><option value="wallet">心愿余额</option><option value="wallet-entry">余额变动详情</option><option value="capture">记一笔</option><option value="new-budget">新建预算</option><option value="new-wish">新建心愿</option><option value="wish-cover">心愿封面</option><option value="agent">小朵</option><option value="settings">设置</option><option value="settlement">结算核对</option><option value="redemption">兑换核对</option></select></label><div class="review-options"><a href="reference/r3-focus.png" target="_blank" rel="noreferrer">查看 R3 基准</a><label><input type="checkbox" id="compare-reduce"> 减少动态效果</label></div></header>
<main class="comparison"><section class="reference-only" id="r3-reference"><div class="theme-label"><h2>R3 基准</h2><a href="reference/r3-focus.png" target="_blank" rel="noreferrer">原图</a></div><div class="reference-crop"><img src="reference/r3-focus.png" alt="已确认 R3 预算卡夹材质基准"></div><p class="reference-note">已确认的静态材质。对照主卡的透光、前挡连续曲面和局部受光；浅暗两侧可操作。</p></section><section><div class="theme-label"><h2>浅色</h2><a id="light-link" target="_blank" rel="noreferrer">单独查看</a></div><div class="frame"><iframe id="light-frame" title="浅色主题交互样稿"></iframe></div></section><section><div class="theme-label"><h2>暗色</h2><a id="dark-link" target="_blank" rel="noreferrer">单独查看</a></div><div class="frame"><iframe id="dark-frame" title="暗色主题交互样稿"></iframe></div></section></main>
<footer>沿用 R34 交互，玻璃保留透色与受光，前卡清楚、后层柔化。所有操作仅影响本页示例；不连接模型、手机账本或真实购买。浏览器材质与动效不代表原生系统玻璃和真机验证。</footer>
<script>
const params=new URLSearchParams(location.search),control=document.querySelector('#compare-view');
const reduce=document.querySelector('#compare-reduce');reduce.checked=params.get('reduce')==='1';
const mainFile=location.pathname.endsWith('/compare.html')?'index.html':'material-themes-20261023.html';
if([...control.options].some(o=>o.value===params.get('view')))control.value=params.get('view');
function paint(){document.querySelector('.comparison').classList.toggle('home-reference',control.value==='home');document.querySelector('#r3-reference').hidden=control.value!=='home';for(const theme of ['light','dark']){const p=new URLSearchParams({theme,view:control.value,embed:'1'});if(reduce.checked)p.set('reduce','1');document.querySelector('#'+theme+'-frame').src=mainFile+'?'+p; p.delete('embed');document.querySelector('#'+theme+'-link').href=mainFile+'?'+p;}const next=new URL(location.href);next.searchParams.set('view',control.value);if(reduce.checked)next.searchParams.set('reduce','1');else next.searchParams.delete('reduce');history.replaceState(null,'',next);}
control.addEventListener('change',paint);reduce.addEventListener('change',paint);paint();
</script></body></html>
