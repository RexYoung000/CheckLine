<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>预算与心愿 · 冰蓝浅暗对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#1c3544;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{max-width:920px;margin:auto;padding:30px 24px 23px;display:flex;gap:18px;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{font-size:25px;font-weight:600;letter-spacing:-.6px;margin:0 0 8px}header p,footer{font-size:12px;line-height:1.8;color:#607583;margin:0}.options{display:flex;gap:18px;align-items:center;font-size:12px}a{color:#31627a;text-underline-offset:4px}input{accent-color:#1d9bc9}button{font:inherit;background:#f8fcff;color:#385c70;border:1px solid #ccdbe5;border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #1597c7;outline-offset:4px}.comparison{display:grid;grid-template-columns:390px 390px;gap:40px;justify-content:center;padding:0 24px 30px}.theme-label{display:flex;align-items:center;justify-content:space-between;padding:0 6px 12px}.theme-label h2{font-size:16px;font-weight:550;margin:0}.theme-label a{font-size:12px}.frame{width:390px;height:844px;overflow:hidden;border:1px solid #ffffff90;border-radius:34px;background:#f9fbfd;box-shadow:0 15px 35px -23px #18384c66}.frame.dark{background:#0c1117;border-color:#222d37}iframe{width:100%;height:100%;border:0;display:block}footer{max-width:880px;margin:auto;padding:0 24px 30px}footer a{margin-right:18px}nav{max-width:880px;margin:0 auto 22px;padding:0 24px;display:flex;align-items:center;gap:14px;font-size:13px}select{font:inherit;min-height:44px;border:1px solid #c8dbe6;background:#f8fcff;color:#204b62;padding:9px 36px 9px 14px;border-radius:12px;max-width:100%}select:focus-visible{outline:2px solid #1597c7;outline-offset:4px}@media(max-width:880px){.comparison{grid-template-columns:min(390px,calc(100vw - 32px));padding-inline:16px;gap:30px}.frame{width:100%;height:844px}header{padding:24px 20px}.options{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><header><div><h1>预算与心愿 · 浅暗对照</h1><p>未实现心愿保留冰蓝玻璃外壳，已实现改为反射金属收藏卡。浅色冰蓝金属，暗色灰金属与黑白 UI；翻面与破壳揭晓保持。</p></div><div class="options"><label><input type="checkbox" id="reduce"> 减少动态效果</label><button id="reset" type="button">还原当前页</button></div></header><nav aria-label="对照页面"><label for="view">查看页面</label><select id="view"><optgroup label="预算"><option value="home">预算首页</option><option value="records">首页记录层</option><option value="library">预算卡库</option><option value="detail">预算详情</option><option value="budget-records">消费记录</option><option value="record">消费详情</option><option value="trend">消费日历</option><option value="history">历史周期</option><option value="info">卡片信息</option></optgroup><optgroup label="心愿"><option value="wish">心愿清单</option><option value="wish-back">心愿大卡背面</option><option value="wallet">心愿余额</option><option value="wallet-entry">余额变动详情</option></optgroup><optgroup label="相关面板"><option value="capture">记一笔</option><option value="new-budget">创建预算卡</option><option value="new-wish">添加心愿</option><option value="wish-cover">心愿封面</option><option value="agent">小朵</option><option value="settings">设置</option><option value="settlement">结算确认</option><option value="redemption">购买确认</option></optgroup></select></nav><main class="comparison"><section><div class="theme-label"><h2>浅色</h2><a id="light-link" target="_blank" rel="noreferrer">单独查看</a></div><div class="frame"><iframe id="light-frame" title="浅色页面交互稿"></iframe></div></section><section><div class="theme-label"><h2>暗色</h2><a id="dark-link" target="_blank" rel="noreferrer">单独查看</a></div><div class="frame dark"><iframe id="dark-frame" title="暗色页面交互稿"></iframe></div></section></main><footer><p><a href="budget-home-pair.html" target="_blank" rel="noreferrer">查看预算首页</a><a href="budget-detail-pair.html" target="_blank" rel="noreferrer">查看详情概览</a>本轮查看反射金属收藏卡与预算细泡；暗色控件同步为黑白灰。仅 HTML 交互稿，示例数据与手机账本隔离。</p></footer><script>
const query=new URLSearchParams(location.search),view=document.querySelector('#view'),reduce=document.querySelector('#reduce');
reduce.checked=query.get('reduce')==='1';
if([...view.options].some(option=>option.value===query.get('view')))view.value=query.get('view');
function paint(){for(const theme of ['light','dark']){const params=new URLSearchParams({theme,view:view.value,embed:'1',rev:'ice-gray-reflection-3'});if(reduce.checked)params.set('reduce','1');if(view.value==='wish'&&query.get('collection')==='done')params.set('collection','done');const url='budget-home.html?'+params;document.querySelector('#'+theme+'-frame').src=url;document.querySelector('#'+theme+'-link').href=url;}}
view.addEventListener('change',()=>{const url=new URL(location.href);url.searchParams.set('view',view.value);history.replaceState(null,'',url);paint();});reduce.addEventListener('change',paint);document.querySelector('#reset').addEventListener('click',paint);paint();
</script></body></html>
