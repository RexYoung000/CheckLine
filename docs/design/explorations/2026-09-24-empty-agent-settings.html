<body>
<div class="review-shell">
<aside class="inspector">
<div class="kicker">CHECKLINE / M4</div>
<h1>从空卡夹开始。</h1>
<p class="intro">空状态、输入与结果，<br>放在同一个连续的空间里。</p>
<nav class="review-nav" aria-label="设计页面">
<button data-jump="home" class="active"><small>01</small>空首页</button>
<button data-jump="budgets"><small>02</small>预算卡</button>
<button data-jump="wishes"><small>03</small>心愿</button>
<button data-jump="insights"><small>04</small>分析</button>
<button data-jump="agent"><small>05</small>Agent</button>
<button data-jump="settings"><small>06</small>个人设置</button>
</nav>
<div class="scenario-section">
<label class="control">查看场景
<select id="scenario"><option value="empty">全新空账本</option><option value="budget">有预算，还没有记录</option><option value="unbudgeted">无预算，有未纳入记录</option><option value="wallet">钱包有结余，没有心愿</option><option value="recovery">有待恢复差额，没有心愿</option><option value="completed">只有已完成心愿</option><option value="record">已有一笔消费</option><option value="save-error">下一次保存失败</option><option value="voice-denied">语音权限被拒绝</option><option value="voice-error">语音转写失败</option><option value="image-error">图片识别失败</option></select></label>
<label class="control">查看宽度
<select id="viewport"><option value="390">390 pt · iPhone</option><option value="350">350 pt · 小屏</option><option value="760">760 pt · 宽屏</option></select></label>
<label class="control check"><input type="checkbox" id="large-type">大字体</label>
<label class="control check"><input type="checkbox" id="reduce-motion">减少动态效果</label>
<button class="reset" id="reset">重置演示数据</button>
</div>
</aside>
<main class="preview-column">
<div class="stage-meta"><b id="state-label">首页 · 空卡夹</b><span>可交互设计稿</span></div>
<div id="app" class="app">
<div id="page" class="page home"></div>
<div id="dock"></div><div id="overlay-host"></div><div id="toast-host" aria-live="polite"></div>
</div>
<p class="caveat">本稿覆盖本轮空状态与 Agent 输入流程。语音、识别、权限和保存均为模拟状态，数据只在此页面临时保留。原生键盘、系统玻璃透镜及真机手感另行验证。</p>
</main>
<aside class="notes">
<div class="eyebrow"><span class="legend-dot"></span>当前查看</div>
<h2 id="note-title">同一个卡夹，从创建开始</h2>
<p id="note-body"></p>
<ol id="note-steps"></ol>
<button class="micro-link" id="demo-fill">填入一条演示需求 ↗</button>
<p class="boundary">已确认：空卡夹与创建卡；Agent 优先、可切表单；轻输入逐步展开；设置聚焦数据与使用；文字、语音、图片分别设计完整状态。</p>
</aside>
</div>

function liquid(){return '<div class="liquid-card '+(s.insert?'inserted':'')+'"><div class="name">'+esc(s.budget.name)+'</div><span class="ellipsis">•••</span><button class="mini-plus" data-action="record" aria-label="记一笔">'+icon('plus')+'</button><span class="amount">'+money(s.budget.cents-total())+'</span></div>'}
function miniCalendar(){return '<div class="calendar-mini">'+Array.from({length:28},function(){return '<i></i>'}).join('')+'</div>'}
function recordRows(records){return records.map(function(r){return '<button class="record-row full" data-action="record-detail" data-index="'+s.records.indexOf(r)+'"><div><strong>'+esc(r.name)+'</strong><p>9月24日'+(r.attachment?' · 附件已保留':'')+(r.unbudgeted?' · 未纳入预算':'')+'</p></div><span class="money">−'+money(r.cents)+'</span></button>'}).join('')}
function budgetRecords(){return s.records.filter(function(r){return !r.unbudgeted})}
function unbudgetedLink(){const count=s.records.filter(function(r){return r.unbudgeted}).length;return count?'<div style="text-align:center;margin:16px 0">'+btn('unbudgeted','未纳入预算 · '+count+' 笔','secondary')+'</div>':''}
function homePage(){
 const card=s.budget?liquid():'<button class="create-card" data-action="create"><span class="cross">'+icon('plus')+'</span><strong>创建第一张<br>预算卡</strong><div class="card-foot">先选一部分，你想管理的开销</div></button>';
 const contents=s.budget?'<div class="summary-grid"><div class="summary"><div class="eyeline">已用'+icon('arrow')+'</div><div class="stat">'+(total()?'−':'')+money(total())+'</div><div class="track"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="summary"><div class="eyeline">九月'+icon('arrow')+'</div><div class="stat">6 <span class="caption muted">天剩余</span></div>'+miniCalendar()+'</div></div><div class="section-title">最近记录<span>当前预算卡</span></div>'+(budgetRecords().length?recordRows(budgetRecords()):'<div class="quiet-empty">这张卡还没有消费记录<br>'+btn('record','记一笔','text-action')+'</div>'):'<div class="empty-pocket"><div class="inner-seam"><p>从日常开销开始，<br>也可以是一次旅行、一个计划。</p></div></div>';
 return header('',true)+'<div class="hero">'+card+'</div><section class="pocket">'+rim()+contents+unbudgetedLink()+'</section>';
}
function budgetPage(){return header('预算卡',false)+'<div class="body-pad">'+(s.budget?'<div class="slot-label">我的卡夹 · 1 张卡</div>'+liquid()+'<div class="budget-meta"><span>'+icon(s.budget.cycle==='monthly'?'repeat':'flag')+' '+(s.budget.cycle==='monthly'?'每月循环':'一次计划')+'</span><span>人民币</span></div><div class="section-title">消费明细</div>'+(budgetRecords().length?recordRows(budgetRecords()):'<div class="quiet-empty">第一笔消费会留在这里。<br>'+btn('record','记一笔','text-action')+'</div>'):'<div class="slot-label">我的卡夹</div><button class="empty-slot" data-action="create"><span class="slot-plus">'+icon('plus')+'</span><h3>放入第一张预算卡</h3><span class="small muted">把想管理的开销，放进自己的卡里。</span></button><p class="body-copy">每张卡，都有自己的用途与预算线。</p><div class="cycle-tags"><span>'+icon('repeat')+'日常循环开销</span><span>'+icon('flag')+'一次特别计划</span></div>')+'</div>'}
function walletOverview(){
 if(!s.walletHistory&&!s.recovery)return '<button class="wallet-compact" data-action="wallet"><span class="label">'+icon('star')+'心愿钱包</span><span class="wallet-number">'+money(s.wallet)+'</span></button>';
 return '<button class="wallet-full" data-action="wallet"><div class="label">心愿钱包</div><div class="wallet-number">'+money(s.wallet)+'</div>'+(s.recovery?'<div class="recovery">待恢复差额 '+money(s.recovery)+'</div>':'')+'<p class="caption muted">来自预算结算的额度，不是真实资金。</p></button>'
}
function wishPage(){
 const list=s.wishes.filter(function(w){return !!w.completed===s.completed});
 const segmented=s.wishes.length?'<div class="segmented" aria-label="心愿分组"><button data-action="wish-active" class="'+(!s.completed?'active':'')+'">心愿清单</button><button data-action="wish-completed" class="'+(s.completed?'active':'')+'">已完成</button></div>':'';
 let content='';
 if(list.length)content=list.map(function(w){return '<button class="wish-row" data-action="wish-detail" data-id="'+w.id+'"><div class="wish-symbol">'+icon(w.symbol)+'</div><div><strong>'+esc(w.name)+'</strong><span>'+(w.completed?'已经实现':w.cents?'预计 '+money(w.cents):'还没有估价')+'</span></div></button>'}).join('');
 else if(s.completed)content='<div class="analysis-intro">'+icon('check')+'<h3 style="margin-top:16px">还没有已完成的心愿</h3><p>真实购买并确认后，会留在这里。</p>'+btn('wish-active','回到心愿清单','secondary')+'</div>';
 else content='<div class="wishlist-empty"><div class="wish-note" aria-hidden="true">'+icon('star')+'<p>一件你想实现的事，<br>值得留个位置。</p></div><h3>给心愿留个位置</h3><p class="small">先写下来，金额可以以后再补。</p>'+btn('add-wish',icon('plus')+'添加心愿')+'</div>';
 return header('心愿',false)+'<div class="body-pad">'+walletOverview()+segmented+content+'</div>';
}
function calendar(disabled){return '<div class="calendar-paper"><div class="calendar-header"><div>2026 年<span class="caption muted" style="display:block;margin-top:5px">九月</span></div><span class="month-number">09</span></div><div class="calendar-grid">'+['一','二','三','四','五','六','日'].map(function(t){return '<div class="day-title">'+t+'</div>'}).join('')+'<div class="blank"></div>'+Array.from({length:30},function(_,i){const day=i+1;return '<button '+(disabled?'disabled':'')+' data-action="day" data-day="'+day+'" class="'+(s.selectedDay===day?'selected ':'')+(day===24&&budgetRecords().length?'has-data':'')+'" aria-label="9月'+day+'日">'+day+'</button>'}).join('')+'</div></div>'}
function insightPage(){
 let content='';
 if(!s.budget)content='<div class="analysis-intro" style="padding-top:0;margin-bottom:20px"><h3>从一张预算卡，<br>看见开销的变化。</h3><p>有了预算卡，就能按日期回看消费。</p>'+btn('create','创建预算卡')+'</div>'+calendar(true);
 else{
 content='<div class="budget-selector"><span>'+esc(s.budget.name)+'</span>'+icon('down')+'</div>';
 if(budgetRecords().length)content+='<div class="chart-box"><div class="small muted">已记录支出</div><div class="total">'+money(total())+'</div><div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i style="height:58px"></i></div><div class="week-labels"><span>9.18</span><span>9.24</span></div></div>';
 else content+='<div class="analysis-intro" style="padding-top:0"><h3>这张卡还没有消费记录</h3><p>记录第一笔，再慢慢看清花费的节奏。</p>'+btn('record',icon('plus')+'记一笔','secondary')+'</div>';
 content+=calendar(false)+'<div class="section-title">9月'+s.selectedDay+'日</div>'+(s.selectedDay===24&&budgetRecords().length?recordRows(budgetRecords()):'<div class="quiet-empty">这一天还没有记录。</div>');
 }
 return header('分析',false)+'<div class="body-pad">'+content+'</div>';
}
function settingRow(key,symbol,title,value){return '<button class="setting-row" data-action="setting" data-setting="'+key+'">'+icon(symbol)+'<span class="row-text">'+title+'</span><span class="row-value">'+value+'</span>'+icon('right','arrow')+'</button>'}
function settingsPage(){
 if(s.settings!=='root')return settingsDetail();
 return '<header class="topbar">'+ib('settings-back','back','返回原页面')+'<h2>个人设置</h2></header><div class="body-pad"><div class="settings-hero"><span class="device">'+icon('phone')+'</span><div><h3>保存在这台设备</h3><p>你的预算与记录，留在本机。</p></div></div><section class="settings-section"><h3>使用偏好</h3><div class="settings-rows">'+settingRow('language','globe','语言','跟随系统')+settingRow('motion','wave','动态效果',$('reduce-motion').checked?'减少动态':'跟随系统')+'</div></section><section class="settings-section"><h3>数据</h3><div class="settings-rows">'+settingRow('storage','phone','保存位置','本机')+settingRow('currency','budget','钱包基准币','CNY')+settingRow('sources','repeat','数据来源','手动与文字')+'</div></section><section class="settings-section"><h3>了解 CheckLine</h3><div class="settings-rows">'+settingRow('privacy','shield','隐私与数据','')+settingRow('about','info','关于','1.0')+'</div></section></div>';
}
function settingsDetail(){
 const map={language:['语言','跟随你的系统语言','当前使用简体中文。正式 App 支持简体中文与英文，语言设置由系统管理。'],motion:['动态效果','跟随系统，保留操作反馈','减少动态效果开启时，卡片入夹改为短淡入，液面保持静止。操作结果、焦点和状态仍然完整可见。'],storage:['保存位置','预算与记录保存在本机','当前账本保存在这台设备。主动添加的消费附件独立存放，可在对应记录中删除。'],currency:['钱包基准币','人民币 · CNY','心愿钱包使用一种基准币。已有钱包分录后，基准币保持不变，避免历史金额失去共同口径。'],privacy:['隐私与数据','由你决定添加什么','账本默认保存在设备。仅用于识别的原图和原音频在提取后丢弃。只有明确选择保存为消费附件的图片才会保留可读副本。'],about:['关于 CheckLine','一张卡，一条自己的预算线。','CheckLine 帮你看见自己设定的消费边界，并在主动结算后，把结余留给心愿。'],sources:['数据来源','从你愿意使用的方式开始','各种来源可以分别选择；任何来源都不是开始使用的门槛。']};
 const d=map[s.settings]||map.about;
 let c='<div class="detail-copy"><h3>'+d[1]+'</h3><p>'+d[2]+'</p></div>';
 if(s.settings==='sources')c+='<div class="detail-section"><p class="caption muted">当前可用</p><div class="source-row"><span>手动填写</span><span class="state ready">可用</span></div><div class="source-row"><span>文字输入</span><span class="state ready">本地处理</span></div></div><div class="detail-section"><p class="caption muted">后续能力</p>'+['语音与图片识别','Apple Pay','短信与邮件','账单导入'].map(function(x){return '<div class="source-row"><span>'+x+'</span><span class="state">暂不可用</span></div>'}).join('')+'</div>';
 if(s.settings==='privacy')c+='<div class="detail-section"><p class="small muted">消费附件最多每笔 5 张。保留前移除图片元数据，删除入口在对应记录内。</p></div>';
 if(s.settings==='about')c+='<div class="detail-section"><p class="small muted">版本 1.0</p></div>';
 return '<header class="topbar">'+ib('settings-back','back','返回个人设置')+'<h2>'+d[0]+'</h2></header><div class="body-pad">'+c+'</div>';
}
function renderDock(){if(s.settings){$('dock').innerHTML='';return}const tabs=[['home','home','首页'],['budgets','budget','预算'],['wishes','heart','心愿'],['insights','chart','分析']];$('dock').innerHTML='<nav class="dock" aria-label="主导航"><div class="tab-group">'+tabs.map(function(t){return '<button data-action="tab" data-tab="'+t[0]+'" class="'+(s.tab===t[0]?'active':'')+'" aria-label="'+t[2]+'" aria-current="'+(s.tab===t[0]?'page':'false')+'">'+icon(t[1])+'</button>'}).join('')+'</div><button class="agent-entry" data-action="agent" aria-label="打开 Agent">'+avatar()+'</button></nav>'}
function render(){
 $('page').className='page '+(!s.settings&&s.tab==='home'?'home':'');
 $('page').innerHTML=s.settings?settingsPage():s.tab==='home'?homePage():s.tab==='budgets'?budgetPage():s.tab==='wishes'?wishPage():insightPage();
 renderDock();renderOverlay();renderToast();updateNotes();
}
function updateNotes(){
 const key=s.settings?'settings':s.agent.open?'agent':s.tab,n=notes[key];
 $('note-title').textContent=n[0];$('note-body').textContent=n[1];$('note-steps').innerHTML=n[2].map(function(x){return '<li>'+x+'</li>'}).join('');
 document.querySelectorAll('[data-jump]').forEach(function(b){b.classList.toggle('active',b.dataset.jump===key)});
 $('state-label').textContent=s.settings?'个人设置'+(s.settings==='root'?'':' · 二级页面'):s.agent.open?'Agent · '+({idle:s.agent.expanded?'完整对话':'轻输入',clarifying:'补充信息','voice-error':'转写失败',recording:'录音中',transcribing:'转写中',transcript:'核对文字',images:'图片预览',thinking:'处理中',review:'确认结果',saving:'保存中',done:'操作结果',denied:'权限受限','image-error':'识别失败'}[s.agent.phase]||'对话'):({home:'首页',budgets:'预算卡',wishes:'心愿',insights:'分析'}[s.tab])+' · '+(s.tab==='wishes'?(s.wishes.length?'心愿清单':'无心愿'):s.budget?(s.records.length?'有消费记录':'有卡，无记录'):'空卡夹');
}
function openAgent(task,origin){
 const a=s.agent;operation++;const hasDraft=a.text.trim()||a.manual||a.images||!['idle','done'].includes(a.phase);
 if(task&&(task!==a.task||a.phase==='done')){a.task=task;a.phase='idle';a.manual=false;a.mode='text';a.error='';a.text='';a.images=0;a.entries=[];a.keepAttachment=false;a.amount=task==='create'?'3000':'35';a.origin=origin||s.tab}
 else if(!hasDraft)a.origin=origin||s.tab;
 if(!task&&!hasDraft&&a.phase!=='done')a.task=s.budget?'general':'create';
 a.open=true;
 if(a.discussion===null&&s.budget)a.discussion=s.budget.name;
 renderOverlay();updateNotes();setTimeout(function(){const t=$('agent-text');if(t)t.focus({preventScroll:true})},100);
}
function closeAgent(){
 if(s.agent.phase==='saving')return;
 operation++;stopVoiceTimer();const a=s.agent;
 if(a.phase==='recording'||a.phase==='transcribing'||a.phase==='thinking'){a.phase=a.mode==='image'&&a.images?'images':'idle'}
 a.open=false;renderOverlay();updateNotes();const b=document.querySelector('[data-action="agent"]');if(b)b.focus({preventScroll:true});
}
function asyncStep(callback,delay){const id=++operation;setTimeout(function(){if(id===operation)callback()},delay)}
function dots(text){return '<div class="busy"><span class="dots"><i></i><i></i><i></i></span>'+text+'</div>'}
function budgetFields(){const a=s.agent;return '<div class="form-row"><label for="budget-name">名称</label><input id="budget-name" data-field="name" value="'+esc(a.name)+'" maxlength="80"></div><div class="form-row"><label for="budget-amount">额度 · CNY</label><input id="budget-amount" data-field="amount" inputmode="decimal" value="'+esc(a.amount)+'"></div><div class="form-row"><label for="budget-cycle">周期</label><select id="budget-cycle" data-field="cycle"><option value="monthly" '+(a.cycle==='monthly'?'selected':'')+'>每月循环</option><option value="once" '+(a.cycle==='once'?'selected':'')+'>一次计划</option></select></div>'}
function attributionOptions(unbudgeted){return (s.budget?'<option value="budget" '+(!unbudgeted?'selected':'')+'>'+esc(s.budget.name)+'</option>':'')+'<option value="none" '+(unbudgeted||!s.budget?'selected':'')+'>未纳入预算</option>'}
function recordFields(){const a=s.agent;return '<div class="form-row"><label for="record-name">消费内容</label><input id="record-name" data-field="merchant" value="'+esc(a.merchant)+'" maxlength="80"></div><div class="form-row"><label for="record-amount">金额 · CNY</label><input id="record-amount" data-field="amount" inputmode="decimal" value="'+esc(a.amount)+'"></div><div class="form-row"><label for="record-attribution">归属</label><select id="record-attribution" data-attribution="single">'+attributionOptions(a.unbudgeted)+'</select></div><div class="form-row"><label>日期</label><span style="margin-left:auto;font-size:13px">2026年9月24日</span></div>'}
function batchFields(){return s.agent.entries.map(function(e,i){return '<section class="batch-row"><h4>第 '+(i+1)+' 笔</h4><div class="form-row"><label for="batch-name-'+i+'">消费内容</label><input id="batch-name-'+i+'" data-entry="'+i+'" data-entry-field="merchant" value="'+esc(e.merchant)+'"></div><div class="form-row"><label for="batch-amount-'+i+'">金额 · CNY</label><input id="batch-amount-'+i+'" data-entry="'+i+'" data-entry-field="amount" inputmode="decimal" value="'+esc(e.amount)+'"></div><div class="form-row"><label for="batch-attribution-'+i+'">归属</label><select id="batch-attribution-'+i+'" data-attribution="'+i+'">'+attributionOptions(e.unbudgeted)+'</select></div><label class="attachment-option"><input type="checkbox" data-attachment="'+i+'" '+(e.keepAttachment?'checked':'')+'><span>保存对应图片为这一笔的附件</span></label></section>'}).join('')}
function errorBox(){return s.agent.error?'<div class="error-box" role="alert">'+esc(s.agent.error)+'</div>':''}
function reviewCard(){
 const a=s.agent,create=a.task==='create',batch=!create&&a.entries.length>1;
 return '<div class="result-card"><div class="result-label">'+icon(create?'budget':'check')+(create?'核对这张预算卡':batch?'逐笔核对 · '+a.entries.length+' 笔消费':'核对这笔消费')+'</div>'+(create?budgetFields():batch?batchFields():recordFields())+(!create&&!batch&&a.mode==='image'?'<label class="attachment-option"><input type="checkbox" id="keep-attachment" '+(a.keepAttachment?'checked':'')+'><span>保存为这笔消费的附件<br><span class="caption muted">关闭时，图片只用于识别。</span></span></label>':'')+errorBox()+btn('confirm',(a.error?'重试保存':create?'确认创建':batch?'确认保存 '+a.entries.length+' 笔':'确认保存'),'primary full')+'<p class="save-hint">'+(create?'确认后，卡片会放入你的卡夹。':'确认金额和归属后再保存；结果可撤销。')+'</p></div>'
}
function voiceView(){
 const a=s.agent;
 if(a.phase==='denied')return '<div class="error-box" role="alert">暂时无法使用麦克风。你可以继续用文字表达同一件事。</div>'+btn('voice-to-text','改用文字','primary full')+'<div style="text-align:center">'+btn('voice-retry','重新尝试','text-action')+'</div>';
 if(a.phase==='voice-error')return '<div class="error-box" role="alert">这次没有听清。可以重新说一遍，或继续用文字填写；此前的草稿仍在。</div>'+btn('voice-retry','重新说一遍','primary full')+'<div style="text-align:center">'+btn('voice-to-text','改用文字','text-action')+'</div>';
 if(a.phase==='transcribing')return dots('正在整理你说的话');
 if(a.phase==='transcript')return '<div class="transcript"><label for="voice-text">先核对，再继续</label><textarea id="voice-text" data-field="text">'+esc(a.text)+'</textarea></div>'+btn('send','继续','primary full');
 return '<div class="voice-surface">'+(a.phase==='recording'?'<div class="waveform" aria-hidden="true">'+[12,22,15,30,20,27,13,22,16,28,19].map(function(v){return '<i style="height:'+v+'px"></i>'}).join('')+'</div><div class="small" aria-live="polite">正在听 · '+a.seconds+' 秒</div>':'<p class="small muted">说说这笔开销，或你想管理的预算。</p>')+'<button class="voice-button '+(a.phase==='recording'?'recording':'')+'" id="voice-control" data-action="voice-click" aria-label="'+(a.phase==='recording'?'结束录音':'开始录音')+'">'+icon('mic')+(a.phase==='recording'?'松开结束，上滑取消':'按住说话')+'</button><div class="voice-help">也可点击开始，再点一次结束</div>'+(a.phase==='recording'?btn('voice-cancel','取消录音','text-action'):'')+'</div>';
}
function imageView(){
 const a=s.agent;
 let thumbs='<div class="image-tray">'+Array.from({length:a.images},function(_,i){return '<div class="receipt-thumb"><button data-action="remove-image" aria-label="删除第'+(i+1)+'张图片">'+icon('close')+'</button><span>消费小票</span><i></i><strong>¥35.00</strong><i></i><i></i></div>'}).join('')+(a.images<5?'<button class="add-image" data-action="add-image" aria-label="添加图片">'+icon('plus')+'</button>':'')+'</div>';
 if(a.phase==='image-error')return thumbs+'<div class="error-box" role="alert">没有看清图片里的金额。图片仍在，可以重试或手动填写。</div>'+btn('recognize','重新识别','primary full')+'<div style="text-align:center">'+btn('manual','手动填写','text-action')+'</div>';
 return '<p class="small muted">添加要核对的图片，继续前可以移除。</p>'+thumbs+'<p class="caption muted">'+a.images+' / 5 张 · 仅用于识别</p>'+(a.images?'<div style="margin-top:15px">'+btn('recognize','继续识别','primary full')+'</div>':'');
}
function renderAgent(){
 const a=s.agent;let content='',foot='';
 const history=a.expanded?a.history.slice(-6).map(function(m){return '<div class="chat-message '+m.role+'">'+esc(m.text)+'</div>'}).join(''):'';

function renderOverlay(){
 const host=$('overlay-host'),previous=host.querySelector('[role="dialog"]'),oldHeight=previous?previous.getBoundingClientRect().height:0,isOpen=s.agent.open||!!s.modal;
 host.innerHTML=s.agent.open?renderAgent():s.modal?renderModal():'';$('page').inert=isOpen;$('dock').inert=isOpen;
 const panel=host.querySelector('[role="dialog"]');if(!panel)return;
 if(!previous){panel.classList.add('opening');const focus=panel.querySelector('input,textarea,button');if(focus)focus.focus({preventScroll:true})}
 else if(!document.documentElement.classList.contains('reduce')&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){const height=panel.getBoundingClientRect().height;if(Math.abs(height-oldHeight)>2)panel.animate([{height:oldHeight+'px'},{height:height+'px'}],{duration:240,easing:'cubic-bezier(.2,.8,.3,1)'})}
}
function toast(msg,undo){const entry={text:msg,undo:undo||null};s.toast=entry;renderToast();setTimeout(function(){if(s.toast===entry){s.toast=null;renderToast()}},6000)}
function renderToast(){$('toast-host').innerHTML=s.toast?'<div class="toast"><span>'+esc(s.toast.text)+'</span><button data-action="'+(s.toast.undo?'undo':'dismiss-toast')+'">'+(s.toast.undo?'撤销':'关闭')+'</button></div>':''}
function parseInput(){
 const a=s.agent,text=a.text.trim();if(!text)return;
 if(['thinking','saving'].includes(a.phase))return;
 a.error='';a.entries=[];
 a.history.push({role:'user',text:text});
 if(/还[能剩]|剩余/.test(text))a.task='general';
 else if(/预算|每月|管理/.test(text))a.task='create';
 else if(/花|午餐|咖啡|消费|交通/.test(text)&&!(/还[能剩]|剩余/.test(text)))a.task='record';
 const amount=text.match(/(\d+(?:\.\d{1,2})?)/);if(amount)a.amount=amount[1];
 if(a.task==='create'){if(/旅行/.test(text))a.name='旅行计划';else if(/日常|生活/.test(text))a.name='日常生活';a.cycle=/一次|旅行/.test(text)?'once':'monthly'}
 if(a.task==='record')a.merchant=/咖啡/.test(text)?'咖啡':/交通|地铁/.test(text)?'交通':'午餐';
 a.phase='thinking';renderOverlay();updateNotes();
 asyncStep(function(){
  if(a.task==='general'){
   const reply=s.budget?esc(s.budget.name)+'当前还能花 '+money(s.budget.cents-total())+'。以上只包含已记录的数据。':'可以先从一张预算卡开始，告诉我你想管理的开销。';
   a.history.push({role:'assistant',text:reply});a.expanded=true;a.phase='idle';a.text='';
  }else if(!amount){a.phase='clarifying';a.error=a.task==='create'?'这张卡准备设置多少预算？补上额度后，我们再核对。':'这笔消费是多少钱？补上金额后，我们再核对。'}
  else a.phase='review';
  renderOverlay();updateNotes();
 },550);
}
function confirm(){
 const a=s.agent,value=cents(a.amount),name=(a.task==='create'?a.name:a.merchant).trim(),batch=a.task==='record'&&a.entries.length>1;
 const rows=batch?a.entries:[{merchant:a.merchant,amount:a.amount,unbudgeted:a.unbudgeted,keepAttachment:a.mode==='image'&&a.keepAttachment}];
 if(a.task==='create'?(!value||!name):rows.some(function(e){return !e.merchant.trim()||!cents(e.amount)})){a.error='请补充名称和大于 0 的金额。';renderOverlay();return}
 if(a.phase==='saving')return;
 const old={budget:s.budget?Object.assign({},s.budget):null,records:s.records.slice()};
 a.manual=false;a.phase='saving';renderOverlay();updateNotes();
 asyncStep(function(){
  if(s.failSave){s.failSave=false;a.phase='review';a.error='没有保存成功。内容仍在，请重试。';renderOverlay();updateNotes();return}
  a.error='';
  if(a.task==='create'){s.budget={name:name,cents:value,cycle:a.cycle};s.insert=true;a.discussion=name}
  else rows.forEach(function(e){s.records.push({name:e.merchant.trim(),cents:cents(e.amount),day:24,attachment:e.keepAttachment,unbudgeted:!s.budget||e.unbudgeted})});
  a.history.push({role:'assistant',text:a.task==='create'?'预算卡已创建：'+name:'已保存 '+rows.length+' 笔消费'});
  a.phase='done';a.text='';
  if(a.origin!=='agent'){a.open=false;s.tab=a.origin==='insights'?'insights':a.origin==='budgets'?'budgets':'home'}
  render();toast(a.task==='create'?'预算卡已创建':rows.length+' 笔消费已保存',old);
  setTimeout(function(){s.insert=false},650);
 },430);
}
function stopVoiceTimer(){if(voiceTimer){clearInterval(voiceTimer);voiceTimer=null}}
function startVoice(){
 const a=s.agent;if(s.denyVoice){a.phase='denied';renderOverlay();updateNotes();return}
 stopVoiceTimer();a.phase='recording';a.seconds=0;renderOverlay();updateNotes();
 voiceTimer=setInterval(function(){a.seconds++;const n=$('overlay-host').querySelector('[aria-live]');if(n)n.textContent='正在听 · '+a.seconds+' 秒'},1000);
}
function endVoice(cancel){
 const a=s.agent;stopVoiceTimer();if(cancel){a.phase='idle';renderOverlay();updateNotes();return}
 a.phase='transcribing';renderOverlay();updateNotes();asyncStep(function(){a.text=a.task==='create'?'日常生活，每月预算 3000 元':'今天午餐花了 35 元';a.phase='transcript';renderOverlay();updateNotes()},550);
}
function recognize(){
 const a=s.agent;if(!a.images)return;a.phase='thinking';renderOverlay();updateNotes();
 asyncStep(function(){if(s.failImage){s.failImage=false;a.phase='image-error'}else{a.task='record';a.merchant='午餐';a.amount='35';a.entries=a.images>1?Array.from({length:a.images},function(_,i){return {merchant:i===0?'午餐':'咖啡',amount:i===0?'35':'18',unbudgeted:!s.budget,keepAttachment:false}}):[];if(a.entries.length>1)a.expanded=true;a.phase='review'}renderOverlay();updateNotes()},650);
}
function setScenario(value){
 operation++;stopVoiceTimer();s.budget=null;s.records=[];s.wishes=[];s.wallet=0;s.recovery=0;s.walletHistory=false;s.completed=false;s.settings=null;s.modal=null;s.toast=null;s.agent=freshAgent();s.failSave=false;s.denyVoice=false;s.failImage=false;s.selectedDay=24;
 if(['budget','wallet','completed','record'].includes(value))s.budget={name:'日常生活',cents:300000,cycle:'monthly'};
 if(value==='wallet'){s.wallet=86000;s.walletHistory=true;s.tab='wishes'}
 if(value==='recovery'){s.recovery=15000;s.walletHistory=true;s.tab='wishes'}
 if(value==='unbudgeted'){s.records=[{name:'午餐',cents:3500,day:24,attachment:false,unbudgeted:true}];s.tab='home'}
 if(value==='completed'){s.wishes=[{id:1,name:'一副新耳机',cents:69900,symbol:'headphones',completed:true}];s.tab='wishes'}
 if(value==='record'){s.records=[{name:'午餐',cents:3500,day:24,attachment:false,unbudgeted:false}];s.tab='insights'}
 if(value==='save-error')s.failSave=true;
 if(value==='voice-denied'){s.denyVoice=true;s.agent.open=true;s.agent.mode='voice';s.agent.phase='denied';s.agent.origin='agent'}
 if(value==='voice-error'){s.agent.open=true;s.agent.mode='voice';s.agent.phase='voice-error';s.agent.origin='agent'}
 if(value==='image-error'){s.failImage=true;s.agent.open=true;s.agent.mode='image';s.agent.images=1;s.agent.phase='image-error';s.agent.task='record';s.agent.origin='agent';s.failImage=false}

function handleAction(b){
 const action=b.dataset.action,a=s.agent;
 if(action==='tab'){s.tab=b.dataset.tab;s.settings=null;s.toast=null;render();$('page').scrollTop=0}
 else if(action==='create'||action==='record'){s.modal=null;openAgent(action==='create'?'create':'record',s.tab)}
 else if(action==='agent')openAgent(null,'agent');
 else if(action==='close-agent')closeAgent();
 else if(action==='expand-agent'){if(performance.now()-lastPanelDrag<350)return;a.expanded=!a.expanded;renderOverlay();updateNotes()}
 else if(action==='manual'){a.manual=!a.manual;a.expanded=a.manual||a.expanded;if(a.task==='general')a.task='record';if(a.manual)a.phase='idle';renderOverlay();updateNotes()}
 else if(action==='send')parseInput();
 else if(action==='confirm')confirm();
 else if(action==='input-mode'){operation++;stopVoiceTimer();a.mode=b.dataset.mode;a.manual=false;a.error='';a.phase=a.mode==='image'?(a.images?'images':'idle'):'idle';renderOverlay();updateNotes()}
 else if(action==='suggest-create'){a.text='日常生活，每月预算 3000 元';a.task='create';a.mode='text';renderOverlay();$('agent-text').focus()}
 else if(action==='suggest-record'){a.text='今天午餐花了 35 元';a.task='record';a.mode='text';renderOverlay();$('agent-text').focus()}
 else if(action==='current-context'){a.discussion=s.budget.name;renderOverlay()}
 else if(action==='voice-click'){if(performance.now()-lastVoiceDown<450)return;if(a.phase==='recording')endVoice(false);else startVoice()}
 else if(action==='voice-cancel')endVoice(true);
 else if(action==='voice-to-text'){a.mode='text';a.phase='idle';renderOverlay()}
 else if(action==='voice-retry'){s.denyVoice=false;a.phase='idle';renderOverlay()}
 else if(action==='add-image'){if(a.images<5)a.images++;a.phase='images';renderOverlay()}
 else if(action==='remove-image'){a.images=Math.max(0,a.images-1);renderOverlay()}
 else if(action==='recognize')recognize();
 else if(action==='view-result'){a.open=false;s.tab=a.task==='create'?'budgets':'home';render()}
 else if(action==='settings'){s.modal=null;s.settings='root';render();$('page').scrollTop=0}
 else if(action==='settings-back'){s.settings=s.settings==='root'?null:'root';render();$('page').scrollTop=0}
 else if(action==='setting'){s.settings=b.dataset.setting;render();$('page').scrollTop=0}
 else if(action==='add-wish'){s.modal='wish';s.modalError='';renderOverlay()}
 else if(action==='wish-symbol'){s.wishSymbol=b.dataset.symbol;renderOverlay()}
 else if(action==='save-wish'){
  if(!s.newWish.trim()){s.modalError='先给这个心愿一个名字。';renderOverlay();return}
  if(s.wishAmount.trim()&&!cents(s.wishAmount)){s.modalError='预计花费请填大于 0 的金额，或暂时留空。';renderOverlay();return}
  s.wishes.push({id:Date.now(),name:s.newWish.trim(),cents:cents(s.wishAmount),symbol:s.wishSymbol,completed:false});s.modal=null;s.completed=false;s.newWish='';s.wishAmount='';render();toast('心愿已添加，钱包额度保持不变。');
 }
 else if(action==='wish-active'||action==='wish-completed'){s.completed=action==='wish-completed';render()}
 else if(action==='wish-detail'){s.modal={type:'wish',id:Number(b.dataset.id)};renderOverlay()}
 else if(action==='record-detail'){s.modal={type:'record',index:Number(b.dataset.index)};renderOverlay()}
 else if(action==='wallet'||action==='attention'||action==='menu'||action==='unbudgeted'){s.modal=action;renderOverlay()}
 else if(action==='close-modal'){s.modal=null;renderOverlay()}
 else if(action==='day'){s.selectedDay=Number(b.dataset.day);render()}
 else if(action==='dismiss-toast'){s.toast=null;renderToast()}
 else if(action==='undo'){if(s.toast&&s.toast.undo){s.budget=s.toast.undo.budget;s.records=s.toast.undo.records;s.toast=null;s.agent.open=false;s.agent.phase='idle';render();toast('已撤销')}}
}

$('viewport').addEventListener('change',function(){document.documentElement.style.setProperty('--preview-width',this.value+'px');$('app').classList.toggle('wide',this.value==='760')});
$('large-type').addEventListener('change',function(){$('app').classList.toggle('large',this.checked)});
$('reduce-motion').addEventListener('change',function(){document.documentElement.classList.toggle('reduce',this.checked);if(s.settings==='root')render()});
$('reset').addEventListener('click',function(){s.tab='home';$('scenario').value='empty';setScenario('empty')});
$('demo-fill').addEventListener('click',function(){openAgent(s.budget?'record':'create',s.tab);s.agent.text=s.budget?'今天午餐花了 35 元':'日常生活，每月预算 3000 元';s.agent.mode='text';s.agent.phase='idle';renderOverlay();$('agent-text').focus()});
render();
})();
</script>
</body>
</html>
