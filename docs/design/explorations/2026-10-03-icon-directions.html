<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CheckLine · 图标方向</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edece8;color:#302a38;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #b99c72;outline-offset:3px}.page{max-width:1260px;margin:auto;padding:36px 42px 32px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}h1{font-size:24px;margin:0;letter-spacing:-.8px}header p{font-size:13px;color:#645b6d;margin:8px 0 0}.theme{border:0;background:#faf9f6;border-radius:50px;padding:11px 20px;color:#302a38}.comparisons{display:grid;grid-template-columns:1fr 1fr;gap:28px}.direction{--canvas:#f5f4f1;--surface:#faf9f6;--ink:#302a38;--muted:#645b6d;--accent:#76618e;--wash:#eae4ee;--top:#d5cce2;--bottom:#a392bc;--line:rgba(48,42,56,.09);background:var(--canvas);color:var(--ink);border-radius:30px;overflow:hidden;border:1px solid rgba(48,42,56,.06);box-shadow:0 12px 32px #302a3809}body.dark{background:#141317;color:#f1ecf5}body.dark header p{color:#b6aebf}body.dark .direction{--canvas:#1c1b20;--surface:#29262f;--ink:#f1ecf5;--muted:#b6aebf;--accent:#c2acdc;--wash:#38303f;--top:#61516f;--bottom:#51415f;--line:rgba(241,236,245,.09)}.intro{display:flex;justify-content:space-between;align-items:center;padding:24px 28px 20px}.intro h2{font-size:20px;letter-spacing:-.5px;margin:0}.intro p{font-size:12px;color:var(--muted);margin:7px 0 0}.appmark{width:68px;height:68px;display:block}.recommend{font-size:11px;font-weight:500;color:var(--accent);margin-left:7px;background:var(--wash);border-radius:20px;padding:4px 8px;vertical-align:middle}.product{margin:0 28px;background:var(--surface);border-radius:24px;padding:18px 20px 18px;box-shadow:0 5px 20px #302a3808}.topbar{display:flex;align-items:center;justify-content:space-between}.tools{display:flex;gap:2px}.iconbutton{border:0;background:none;color:var(--ink);width:44px;height:44px;border-radius:50%;display:grid;place-items:center}.glyph{width:24px;height:24px;display:block;flex-shrink:0}.body{padding-top:16px}.liquid{height:208px;border-radius:23px;background:var(--canvas);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}.cardname{position:absolute;left:23px;top:20px;font-size:23px;font-weight:600;letter-spacing:-.7px}.carddate{position:absolute;left:23px;top:55px;font-size:12px;color:var(--muted)}.liquidwave{position:absolute;width:100%;bottom:0;height:112px}.balance{position:absolute;right:23px;bottom:17px;text-align:right}.balance span{font-size:12px}.balance strong{display:block;font-size:41px;line-height:1.2;letter-spacing:-2px;font-weight:500;margin-top:2px}.balance small{font-size:23px;font-weight:400;letter-spacing:0;margin-right:4px}.metrics{display:flex;justify-content:space-between;padding:14px 3px;color:var(--muted);font-size:12px}.metrics b{color:var(--ink);font-weight:500}.dock{display:flex;align-items:center;gap:12px;margin:9px 0 0}.tabs{display:flex;border-radius:40px;background:var(--canvas);padding:4px;flex:1;box-shadow:inset 0 0 0 1px var(--line)}.tab{display:grid;place-items:center;gap:4px;flex:1;min-width:44px;height:56px;border:0;background:none;border-radius:40px;color:var(--muted);font-size:10px}.tab[aria-pressed=true]{background:var(--wash);color:var(--accent);box-shadow:0 1px 5px #302a380c}.tab[aria-pressed=true] span{font-weight:650}.mascot{width:50px;height:50px;flex-shrink:0;filter:drop-shadow(0 4px 4px #4c317b22)}.section{margin:22px 28px 0}.sectiontitle{font-size:12px;color:var(--muted);margin:0 0 12px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{height:90px;background:var(--surface);border-radius:20px;padding:15px 18px;color:var(--accent);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}.tile span{font-size:13px;color:var(--ink)}.composer{margin-top:10px;border-radius:20px;background:var(--surface);padding:16px;display:flex;justify-content:space-between;align-items:center}.composer span{font-size:12px;color:var(--muted)}.composeactions{display:flex;gap:4px}.send{background:var(--accent);color:var(--surface)}.catalog{display:grid;grid-template-columns:repeat(6,1fr);gap:20px 8px;padding:23px 28px 26px;margin-top:20px;border-top:1px solid var(--line)}.sample{display:grid;justify-items:center;gap:9px;color:var(--accent)}.sample span{font-size:10px;color:var(--muted)}footer{font-size:12px;color:#645b6d;margin:18px 0 0}body.dark footer{color:#b6aebf}@media(max-width:800px){.page{padding:22px 18px}.comparisons{grid-template-columns:1fr}.intro,.catalog{padding-left:22px;padding-right:22px}.product,.section{margin-left:22px;margin-right:22px}header{gap:12px}h1{font-size:21px}.recommend{display:inline-block}.intro h2{font-size:18px}}
</style>
<main class="page">
  <header><div><h1>CheckLine · 图标方向</h1><p>同一页面、同一紫色，对照线条与剪影。</p></div><button class="theme" aria-pressed="false">查看深色</button></header>
  <div class="comparisons"></div>
  <footer>图标外观提案 · 示例数据用于视觉对照 · 尚未替换原生 App</footer>
</main>
<script type="module">
import { icon, mark, samples } from './2026-10-03-icon-directions.mjs';
const cloud=`<svg class="mascot" viewBox="0 0 64 60" aria-hidden="true"><defs><linearGradient id="cloud" x2=".8" y2="1"><stop stop-color="#8976bd"/><stop offset=".4" stop-color="#563496"/><stop offset="1" stop-color="#a698ed"/></linearGradient></defs><path d="M12 36C3 30 7 18 15 18c0-11 15-16 22-8 11-3 20 8 15 17 10 11-3 20-12 18-8 10-21 3-22-2-7 2-13-1-6-7Z" fill="url(#cloud)"/><ellipse cx="26" cy="27" rx="2.2" ry="4" fill="#fffdf4"/><ellipse cx="36" cy="27" rx="2.2" ry="4" fill="#fffdf4"/></svg>`;
for(const [style,title,description] of [['line','A · 柔圆线条','轻、干净，适合当前液位卡与玻璃导航。'],['solid','B · 柔面剪影','更饱满、更醒目，图形自身有层次。']]){
 document.querySelector('.comparisons').insertAdjacentHTML('beforeend', `<article class="direction" data-style="${style}"><div class="intro"><div><h2>${title}${style==='line'?'<span class="recommend">推荐</span>':''}</h2><p>${description}</p></div>${mark(style)}</div><div class="product"><div class="topbar"><button class="iconbutton" aria-label="个人设置">${icon('user',style)}</button><div class="tools"><button class="iconbutton" aria-label="待处理">${icon('bell',style)}</button><button class="iconbutton" aria-label="更多操作">${icon('more',style)}</button></div></div><div class="body"><div class="liquid"><div class="cardname">日常生活</div><div class="carddate">10 月 1 日—31 日 · CNY</div><svg class="liquidwave" viewBox="0 0 400 112" preserveAspectRatio="none"><defs><linearGradient id="water-${style}" x2="0" y2="1"><stop stop-color="var(--top)"/><stop offset="1" stop-color="var(--bottom)"/></linearGradient></defs><path d="M0 12C60-12 105 35 170 12S265 30 325 12 380 4 400 12V112H0Z" fill="url(#water-${style})"/></svg><div class="balance"><span>还能花</span><strong><small>¥</small>1,280</strong></div></div><div class="metrics"><span>已用 <b>¥1,720</b></span><span>额度 <b>¥3,000</b></span></div><div class="dock"><div class="tabs" aria-label="底栏图标选中对照">${[['home','首页'],['budget','预算'],['wish','心愿'],['analysis','分析']].map(([key,label],index)=>`<button class="tab" aria-pressed="${index===0}" aria-label="${label}图标选中态">${icon(key,style)}<span>${label}</span></button>`).join('')}</div>${cloud}</div></div></div><div class="section"><p class="sectiontitle">工作区入口与输入操作</p><div class="tiles">${[['receipt','消费记录'],['calendar','消费日历'],['history','历史周期'],['settings','卡片管理']].map(([key,label])=>`<div class="tile">${icon(key,style)}<span>${label}</span></div>`).join('')}</div><div class="composer"><span>可以跟小朵说：午餐 35 元</span><div class="composeactions"><div class="iconbutton">${icon('mic',style)}</div><div class="iconbutton send">${icon('send',style)}</div></div></div></div><div class="catalog">${samples.map(([key,label])=>`<div class="sample">${icon(key,style)}<span>${label}</span></div>`).join('')}</div></article>`);
}
document.querySelector('.theme').addEventListener('click',event=>{
 const dark=document.body.classList.toggle('dark');event.currentTarget.textContent=dark?'查看浅色':'查看深色';event.currentTarget.setAttribute('aria-pressed',String(dark));
});
document.querySelectorAll('.tabs').forEach(tabs=>tabs.addEventListener('click',event=>{
 const target=event.target.closest('button');if(!target)return;tabs.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button===target)));
}));
</script>
</html>
