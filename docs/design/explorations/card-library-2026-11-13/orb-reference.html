<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CheckLine · 自然柔光对照</title><link rel="stylesheet" href="./orb.css?rev=glints-1">
<style>
*{box-sizing:border-box}body{margin:0;padding:30px;background:#e9eef2;color:#20313c;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:820px;margin:auto}h1{font-size:22px;font-weight:600;margin:0 0 6px}p{margin:0 0 18px;color:#65747d}nav{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:24px}button{font:inherit;color:inherit;padding:8px 14px;border:1px solid #bccbd5;background:white;border-radius:10px;cursor:pointer}button[aria-pressed=true]{background:#20313c;color:white}label{margin-left:12px}#pair{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}section{width:320px;background:#f8f8f8;border-radius:24px;padding:18px 24px 28px;text-align:center}section[data-theme=dark]{background:#080808;color:#f4f7fa}h2{font-size:13px;font-weight:500;margin:0 0 12px}.host{display:flex;justify-content:center}.cll-orb{width:260px}.cll-orb__date{margin-top:10px}.cll-orb__value{font-size:36px}
</style><script src="./orb.js?rev=glints-1"></script></head>
<body><main><h1>浅色细颗粒 · 周期切换</h1><p>浅色重新适配细颗粒，深色保持原样。以下使用独立示例周期。</p>
<nav aria-label="示例周期"><button data-case="reference" aria-pressed="true">还剩 10 天 · 1/3</button><button data-case="more" aria-pressed="false">还剩 20 天 · 2/3</button><button data-case="open" aria-pressed="false">无截止日期</button><button data-case="due" aria-pressed="false">待结算</button><label><input id="reduce" type="checkbox">减少动态</label></nav>
<div id="pair"><section data-theme="light"><h2>浅色</h2><div class="host"></div></section><section data-theme="dark"><h2>深色</h2><div class="host"></div></section></div>
</main><script>
const models={
 reference:{label:'本期还剩',value:'10',unit:'天',dateText:'示例周期 · 共 30 天',state:'active',remaining:1/3,ariaLabel:'示例周期，还剩10天，共30天'},
 more:{label:'本期还剩',value:'20',unit:'天',dateText:'示例周期 · 共 30 天',state:'active',remaining:2/3,ariaLabel:'示例周期，还剩20天，共30天'},
 open:{label:'本次预算',value:'进行中',unit:'',dateText:'未设截止日期',state:'open',remaining:null,ariaLabel:'示例周期，进行中，未设截止日期'},
 due:{label:'本期已结束',value:'待结算',unit:'',dateText:'示例周期已结束',state:'due',remaining:0,ariaLabel:'示例周期已结束，待结算'}
};
let selected='reference',orbs=[];
function mount(){orbs.forEach(orb=>orb.destroy());orbs=[...document.querySelectorAll('section')].map(section=>CheckLinePeriodOrb.create(section.querySelector('.host'),{dark:section.dataset.theme==='dark',reduced:document.querySelector('#reduce').checked}));orbs.forEach(orb=>orb.update(models[selected],{immediate:true}));}
document.querySelectorAll('button[data-case]').forEach(button=>button.addEventListener('click',()=>{selected=button.dataset.case;document.querySelectorAll('button[data-case]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));orbs.forEach(orb=>orb.update(models[selected]));}));
document.querySelector('#reduce').addEventListener('change',mount);mount();
</script></body></html>
