<body>
<div class="review-shell">
<aside class="inspector">
<div class="kicker">CHECKLINE / M4</div>
<h1>轻一点，<br>连续一点。</h1>
<p class="intro">淡紫玻璃、轻盈液面，<br>从一张卡走进它的故事。</p>
<nav class="review-nav" aria-label="设计页面">
<button data-jump="home" class="active"><small>01</small>首页</button>
<button data-jump="budgets"><small>02</small>预算卡</button>
<button data-jump="wishes"><small>03</small>心愿</button>
<button data-jump="insights"><small>04</small>分析</button>
<button data-jump="agent"><small>05</small>Agent</button>
<button data-jump="settings"><small>06</small>个人设置</button>
</nav>
<div class="scenario-section">
<label class="control">查看场景
<select id="scenario"><option value="collection">多卡 · 清透液面</option><option value="dry">预算用完 / 越线</option><option value="long-list">长列表 · 18 张卡</option><option value="empty">全新空账本</option><option value="budget">有预算，还没有记录</option><option value="unbudgeted">无预算，有未纳入记录</option><option value="wallet">钱包有结余，没有心愿</option><option value="recovery">有待恢复差额，没有心愿</option><option value="completed">只有已完成心愿</option><option value="record">已有一笔消费</option><option value="save-error">下一次保存失败</option><option value="voice-denied">语音权限被拒绝</option><option value="voice-error">语音转写失败</option><option value="image-error">图片识别失败</option></select></label>
<label class="control">查看宽度
<select id="viewport"><option value="390">390 px · 手机</option><option value="350">350 px · 窄屏</option><option value="760">760 px · 宽屏</option></select></label>
<label class="control check"><input type="checkbox" id="large-type">大字体</label>
<label class="control check"><input type="checkbox" id="reduce-motion">减少动态效果</label>
<button class="reset" id="reset">重置演示数据</button>
</div>
</aside>
<main class="preview-column">
<div class="stage-meta"><b id="state-label">首页 · 空卡夹</b><span>可交互设计稿</span></div>
<div id="app" class="app">
<div id="page" class="page home"></div>
<div id="detail-host"></div><div id="dock"></div><div id="overlay-host"></div><div id="toast-host" aria-live="polite"></div>
</div>
<p class="caveat">本稿用于审阅材质与连续交互。可按住卡片、上下滚动预算列表、点卡进入详情、拖动 Agent。语音、识别、权限和保存均为模拟状态，数据只在此页面临时保留。原生键盘、系统玻璃透镜及真机手感另行验证。</p>
</main>
<aside class="notes">
<div class="eyebrow"><span class="legend-dot"></span>当前查看</div>
<h2 id="note-title">同一个卡夹，从创建开始</h2>
<p id="note-body"></p>
<ol id="note-steps"></ol>
<button class="micro-link" id="demo-fill">填入一条演示需求 ↗</button>
<p class="boundary">本轮方向：浅紫玻璃与朦胧液面；两处点卡都进详情；圆柱聚焦；Agent 三段抽屉。底部四 Tab + 独立 Agent 结构保留。实际原生透镜与触觉另行验证。</p>
</aside>

function openAgent(task,origin){
 const a=s.agent;operation++;const hasDraft=a.text.trim()||a.manual||a.images||!['idle','done'].includes(a.phase);
 if(task&&(task!==a.task||a.phase==='done')){a.task=task;a.phase='idle';a.manual=false;a.mode='text';a.error='';a.text='';a.images=0;a.entries=[];a.keepAttachment=false;a.amount=task==='create'?'3000':'35';a.origin=origin||s.tab}
 else if(!hasDraft)a.origin=origin||s.tab;
 if(!task&&!hasDraft&&a.phase!=='done')a.task=s.budget?'general':'create';
 a.open=true;
 if(a.task==='record'){const selected=s.budgets.find(b=>b.id===a.recordBudgetID&&!b.settled)||s.budgets.find(b=>!b.settled);a.recordBudgetID=selected?.id||null;if(!selected)a.unbudgeted=true;}
 if(a.discussion===null&&s.budget)a.discussion=s.budget.name;if(!a.recordBudgetID&&s.budget)a.recordBudgetID=s.budget.id;
 renderOverlay();updateNotes();setTimeout(function(){const t=$('agent-text');if(t)t.focus({preventScroll:true})},100);
}
function closeAgent(){
 if(s.agent.phase==='saving')return;
 operation++;stopVoiceTimer();const a=s.agent;
 if(a.phase==='recording'||a.phase==='transcribing'||a.phase==='thinking'){a.phase=a.mode==='image'&&a.images?'images':'idle'}
 a.open=false;renderOverlay();updateNotes();const b=document.querySelector('[data-action="agent"]');if(b)b.focus({preventScroll:true});
}

function imageView(){
 const a=s.agent;
 let thumbs='<div class="image-tray">'+Array.from({length:a.images},function(_,i){return '<div class="receipt-thumb"><button data-action="remove-image" aria-label="删除第'+(i+1)+'张图片">'+icon('close')+'</button><span>消费小票</span><i></i><strong>¥35.00</strong><i></i><i></i></div>'}).join('')+(a.images<5?'<button class="add-image" data-action="add-image" aria-label="添加图片">'+icon('plus')+'</button>':'')+'</div>';
 if(a.phase==='image-error')return thumbs+'<div class="error-box" role="alert">没有看清图片里的金额。图片仍在，可以重试或手动填写。</div>'+btn('recognize','重新识别','primary full')+'<div style="text-align:center">'+btn('manual','手动填写','text-action')+'</div>';
 return '<p class="small muted">添加要核对的图片，继续前可以移除。</p>'+thumbs+'<p class="caption muted">'+a.images+' / 5 张 · 仅用于识别</p>'+(a.images?'<div style="margin-top:15px">'+btn('recognize','继续识别','primary full')+'</div>':'');
}
function renderAgent(){
 const a=s.agent,expandLabel=a.detent===2?'收起到轻输入':a.detent===1?'展开完整对话':'展开到半屏';let content='',foot='';
 const history=a.expanded?a.history.slice(-6).map(function(m){return '<div class="chat-message '+m.role+'">'+esc(m.text)+'</div>'}).join(''):'';
 if(a.manual)content='<div class="mode-toggle"><span>手动填写 · 草稿仍然保留</span>'+btn('manual','切回 Agent','text-action')+'</div><div class="result-card">'+(a.task==='create'?budgetFields():recordFields())+errorBox()+btn('confirm',a.task==='create'?'创建预算卡':'保存消费','primary full')+'</div>';
 else if(a.phase==='thinking'||a.phase==='saving')content=dots(a.phase==='saving'?'正在保存':'正在整理这条输入');
 else if(a.phase==='clarifying')content='<div class="chat-message assistant">'+esc(a.error)+'</div><div class="mode-toggle"><span>你已经写下的内容仍在</span>'+btn('manual','打开表单','text-action')+'</div>';
 else if(a.phase==='review')content=reviewCard();
 else if(a.phase==='done')content='<div class="result-card"><div class="success-line">'+icon('check')+'已保存</div><h3>'+esc(a.task==='create'?s.budget.name:a.entries.length>1?a.entries.length+' 笔消费':a.merchant)+'</h3><p class="small muted" style="margin-top:8px">'+(a.task==='create'?'预算卡已放入卡夹。':'消费已更新到对应记录。')+'</p>'+btn('view-result','查看结果','text-action')+'</div>';
 else if(a.mode==='voice')content=voiceView();
 else if(a.mode==='image')content=imageView();
 else content='<div class="agent-welcome"><div class="welcome-orb">'+icon('star')+'</div><h3>'+(a.task==='create'?'想给哪部分生活留张卡？':a.task==='record'?'把这笔开销放进来。':'今天，想一起梳理什么？')+'</h3><p>从一件小事开始，也可以先随便聊聊。</p></div><div class="suggestions"><button data-action="suggest-create">为日常生活，留一张预算卡</button>'+(s.budget?'<button data-action="suggest-remaining">'+esc(a.discussion||s.budget.name)+'，这个月还能花多少？</button><button data-action="suggest-record">今天午餐花了 35 元</button>':'')+'</div><div class="mode-toggle"><span>或者，自己慢慢填写</span>'+btn('manual','打开表单','text-action')+'</div>';
 if(!a.manual&&!['review','thinking','saving'].includes(a.phase)){
 foot='<div class="composer">'+(a.mode==='text'?'<textarea id="agent-text" data-field="text" aria-label="告诉 Agent 你的需求" placeholder="'+(a.task==='create'?'例如：日常生活，每月 3000 元':'例如：今天午餐花了 35 元')+'" rows="2">'+esc(a.text)+'</textarea>':'')+'<div class="composer-tools">'+['text','voice','image'].map(function(m){return '<button class="icon-btn '+(a.mode===m?'active':'')+'" data-action="input-mode" data-mode="'+m+'" aria-label="'+({text:'文字输入',voice:'语音输入',image:'图片输入'}[m])+'">'+icon({text:'keyboard',voice:'mic',image:'image'}[m])+'</button>'}).join('')+'<span class="spacer"></span>'+(a.mode==='text'?'<button class="send" data-action="send" aria-label="发送">'+icon('send')+'</button>':'')+'</div></div>';
 }
 return '<div class="overlay"><div class="backdrop" data-action="close-agent"></div><section class="agent-panel '+(a.expanded?'expanded':'')+'" role="dialog" aria-modal="true" aria-label="预算助手"><button class="handle" data-action="expand-agent" aria-label="'+expandLabel+'"></button><header class="agent-head">'+avatar()+'<div class="heading"><h3>预算助手</h3><p class="subtitle">'+(a.task==='create'?'创建预算卡':a.task==='record'?'记一笔':'继续上次的话题')+'</p></div>'+ib('expand-agent',a.detent===2?'down':'expand',expandLabel)+ib('close-agent','close','关闭 Agent')+'</header><div class="task-context"><span>'+(a.task==='create'?'新建 · 一条自己的预算线':a.discussion?'正在聊 · '+esc(a.discussion):'还没有选择讨论的预算')+'</span>'+((s.budget&&a.discussion!==s.budget.name)?btn('current-context','聊聊当前预算','text-action'):'')+'</div><div class="agent-body">'+history+content+'</div>'+foot+'<div class="composer-subtitle">切换输入方式会保留当前草稿</div></section></div>';
}
function renderModal(){
 const extra=modalExtras();if(extra)return extra;
 let title='',body='';
 if(s.modal==='wish'){
 title='添加心愿';body='<p class="small muted">先写下想实现的一件事。</p><label class="field"><span>心愿名称</span><input id="wish-name" value="'+esc(s.newWish)+'" placeholder="例如：一副新耳机" maxlength="80"></label><label class="field"><span>预计花费 · 可选</span><input id="wish-amount" value="'+esc(s.wishAmount)+'" inputmode="decimal" placeholder="以后再想也可以"></label><p class="small muted">选一个符号</p><div class="symbol-choices">'+['star','headphones','tent','book','heart'].map(function(n){return '<button data-action="wish-symbol" data-symbol="'+n+'" class="'+(s.wishSymbol===n?'active':'')+'" aria-label="'+({star:'星星',headphones:'耳机',tent:'帐篷',book:'书本',heart:'心愿'}[n])+'">'+icon(n)+'</button>'}).join('')+'</div>'+(s.modalError?'<div class="error-box" role="alert">'+s.modalError+'</div>':'')+btn('save-wish','添加到心愿清单','primary full');
 }else if(s.modal==='wallet'){
 title='心愿钱包';body='<p style="font-size:38px;margin:12px 0">'+money(s.wallet)+'</p><p class="small muted">来自预算结算的额度，不是真实资金。</p><div class="detail-section"><p class="small">心愿不会预先占用这笔额度。真实购买并确认后，再按实际金额从心愿钱包中扣减。</p></div>'+(s.recovery?'<div class="detail-section"><p class="small">待恢复差额：'+money(s.recovery)+'</p></div>':'');
 }else if(s.modal==='attention'){title='待处理';body='<div class="quiet-empty">目前没有需要确认的事项。</div>'}
 else if(s.modal==='unbudgeted'){title='未纳入预算';body='<p class="small muted">这些记录已经保存，尚未计入任何预算卡。</p>'+recordRows(s.records.filter(function(r){return r.unbudgeted}))}
 else if(s.modal==='menu'){title='快捷操作';body='<div class="settings-rows">'+settingAction('create','budget','创建预算卡')+settingAction('record','plus','记一笔')+settingAction('settings','user','个人设置')+'</div>'}
 else if(s.modal&&s.modal.type==='record'){const r=s.records[s.modal.index]||s.records[0];title='消费详情';body=r?'<h3>'+esc(r.name)+'</h3><p style="font-size:36px;margin:18px 0">'+money(r.cents)+'</p><p class="small muted">2026年9月24日 · '+esc(r.unbudgeted?'未纳入预算':s.budget.name)+'</p><div class="detail-section"><p class="small">'+(r.attachment?'已保留图片附件':'没有添加备注或附件')+'</p></div>':''}
 else if(s.modal&&s.modal.type==='wish'){const w=s.wishes.find(function(x){return x.id===s.modal.id});title='心愿详情';body=w?'<div style="text-align:center;margin:20px 0;color:#c6b8ee">'+icon(w.symbol)+'</div><h3>'+esc(w.name)+'</h3><p style="font-size:29px;margin:18px 0">'+(w.cents?money(w.cents):'暂未填写预计花费')+'</p><p class="small muted">'+(w.completed?'已完成的心愿，留在这里。':'添加心愿不会分配或冻结钱包额度。')+'</p>':''}
 return '<div class="overlay"><div class="backdrop" data-action="close-modal"></div><section class="modal-panel" role="dialog" aria-modal="true" aria-label="'+title+'"><header class="modal-head"><h3>'+title+'</h3>'+ib('close-modal','close','关闭')+'</header>'+body+'</section></div>';
}
function settingAction(action,name,text){return '<button class="setting-row" data-action="'+action+'">'+icon(name)+'<span class="row-text">'+text+'</span>'+icon('right','arrow')+'</button>'}
function toast(msg,undo){const entry={text:msg,undo:undo||null};s.toast=entry;renderToast();setTimeout(function(){if(s.toast===entry){s.toast=null;renderToast()}},6000)}
function renderToast(){$('toast-host').innerHTML=s.toast?'<div class="toast"><span>'+esc(s.toast.text)+'</span><button data-action="'+(s.toast.undo?'undo':'dismiss-toast')+'">'+(s.toast.undo?'撤销':'关闭')+'</button></div>':''}
function parseInput(){
 const a=s.agent,text=a.text.trim();if(!text)return;
 if(['thinking','saving'].includes(a.phase))return;
 a.error='';a.entries=[];
 a.history.push({role:'user',text:text});
 if(/还[能剩]|剩余/.test(text))a.task='general';
 else if(/预算|每月|管理/.test(text))a.task='create';
 else if(/花|午餐|咖啡|消费|交通/.test(text)&&!(/还[能剩]|剩余/.test(text)))a.task='record';
 const amount=text.match(/(\d+(?:\.\d{1,2})?)/);if(amount)a.amount=amount[1];
 if(a.task==='create'){if(/旅行/.test(text))a.name='旅行计划';else if(/日常|生活/.test(text))a.name='日常生活';a.cycle=/一次|旅行/.test(text)?'once':'monthly'}
 if(a.task==='record')a.merchant=/咖啡/.test(text)?'咖啡':/交通|地铁/.test(text)?'交通':'午餐';
 a.phase='thinking';renderOverlay();updateNotes();
 asyncStep(function(){
  if(a.task==='general'){
   const discussed=s.budgets.find(b=>b.id===a.recordBudgetID)||s.budget;const reply=discussed?discussed.name+(discussed.settled?'结算时结余 ':'当前还能花 ')+money(discussed.cents-total(discussed))+'。以上只包含已记录的数据。':'可以先从一张预算卡开始，告诉我你想管理的开销。';
   a.history.push({role:'assistant',text:reply});a.detent=2;a.expanded=true;a.phase='idle';a.text='';
  }else if(!amount){a.phase='clarifying';a.error=a.task==='create'?'这张卡准备设置多少预算？补上额度后，我们再核对。':'这笔消费是多少钱？补上金额后，我们再核对。'}
  else a.phase='review';
  renderOverlay();updateNotes();
 },550);
}
function confirm(){
 const a=s.agent,value=cents(a.amount),name=(a.task==='create'?a.name:a.merchant).trim(),batch=a.task==='record'&&a.entries.length>1;
 const rows=batch?a.entries:[{merchant:a.merchant,amount:a.amount,unbudgeted:a.unbudgeted,keepAttachment:a.mode==='image'&&a.keepAttachment}];
 if(a.task==='create'?(!value||!name):rows.some(function(e){return !e.merchant.trim()||!cents(e.amount)})){a.error='请补充名称和大于 0 的金额。';renderOverlay();return}
 if(a.phase==='saving')return;
 if(a.task!=='create'&&rows.some(e=>!e.unbudgeted&&s.budgets.find(b=>b.id===(e.budgetID||a.recordBudgetID||s.budget?.id))?.settled)){a.error='该周期已结算，请先选择其他归属；追溯变更需要完整影响预览。';renderOverlay();return}
 const old=snapshot();
 a.manual=false;a.phase='saving';renderOverlay();updateNotes();
 asyncStep(function(){
  if(s.failSave){s.failSave=false;a.phase='review';a.error='没有保存成功。内容仍在，请重试。';renderOverlay();updateNotes();return}
  a.error='';
  if(a.task==='create'){s.budget={id:'b'+Date.now(),name:name,cents:value,cycle:a.cycle,tint:'lilac'};s.budgets.push(s.budget);s.focusID=s.budget.id;s.insert=true;a.discussion=name}
  else rows.forEach(function(e){s.records.unshift({id:'r'+Date.now()+'-'+Math.random().toString(16).slice(2,6),name:e.merchant.trim(),cents:cents(e.amount),day:24,attachment:e.keepAttachment,unbudgeted:!s.budget||e.unbudgeted,budgetID:!s.budget||e.unbudgeted?null:(e.budgetID||a.recordBudgetID||s.budget.id)})});
  a.history.push({role:'assistant',text:a.task==='create'?'预算卡已创建：'+name:'已保存 '+rows.length+' 笔消费'});
  a.phase='done';a.text='';
  if(a.origin!=='agent'){a.open=false;s.tab=a.origin==='insights'?'insights':a.origin==='budgets'?'budgets':'home'}
  render(a.task==='create');toast(a.task==='create'?'预算卡已创建':rows.length+' 笔消费已保存',old);
  setTimeout(function(){s.insert=false},650);
 },430);
}
function stopVoiceTimer(){if(voiceTimer){clearInterval(voiceTimer);voiceTimer=null}}
function startVoice(){
 const a=s.agent;if(s.denyVoice){a.phase='denied';renderOverlay();updateNotes();return}
 stopVoiceTimer();a.phase='recording';a.seconds=0;renderOverlay();updateNotes();
 voiceTimer=setInterval(function(){a.seconds++;const n=$('overlay-host').querySelector('[aria-live]');if(n)n.textContent='正在听 · '+a.seconds+' 秒'},1000);
}
function endVoice(cancel){
 const a=s.agent;stopVoiceTimer();if(cancel){a.phase='idle';renderOverlay();updateNotes();return}
 a.phase='transcribing';renderOverlay();updateNotes();asyncStep(function(){a.text=a.task==='create'?'日常生活，每月预算 3000 元':'今天午餐花了 35 元';a.phase='transcript';renderOverlay();updateNotes()},550);
}
function recognize(){
 const a=s.agent;if(!a.images)return;a.phase='thinking';renderOverlay();updateNotes();
 asyncStep(function(){if(s.failImage){s.failImage=false;a.phase='image-error'}else{a.task='record';a.merchant='午餐';a.amount='35';a.entries=a.images>1?Array.from({length:a.images},function(_,i){return {merchant:i===0?'午餐':'咖啡',amount:i===0?'35':'18',unbudgeted:!s.budget,keepAttachment:false}}):[];if(a.entries.length>1){a.expanded=true;a.detent=2;}a.phase='review'}renderOverlay();updateNotes()},650);
}
function setScenario(value){
 operation++;stopVoiceTimer();s.budget=null;s.budgets=[];s.detail=null;s.focusID=null;s.modalSource=null;s.records=[];s.wishes=[];s.wallet=0;s.recovery=0;s.walletHistory=false;s.completed=false;s.settings=null;s.modal=null;s.toast=null;s.agent=freshAgent();s.failSave=false;s.denyVoice=false;s.failImage=false;s.selectedDay=24;
 if(['budget','wallet','completed','record'].includes(value))s.budget={id:'daily',name:'日常生活',cents:300000,cycle:'monthly',tint:'lilac'};
 if(value==='wallet'){s.wallet=86000;s.walletHistory=true;s.tab='wishes'}
 if(value==='recovery'){s.recovery=15000;s.walletHistory=true;s.tab='wishes'}
 if(value==='unbudgeted'){s.records=[{id:'r1',name:'午餐',cents:3500,day:24,attachment:false,unbudgeted:true,budgetID:null}];s.tab='home'}
 if(value==='completed'){s.wishes=[{id:1,name:'一副新耳机',cents:69900,symbol:'headphones',completed:true}];s.tab='wishes'}
 if(value==='record'){s.records=[{id:'r1',name:'午餐',cents:3500,day:24,attachment:false,unbudgeted:false,budgetID:'daily'}];s.tab='insights'}
 if(value==='save-error')s.failSave=true;
 if(value==='voice-denied'){s.denyVoice=true;s.agent.open=true;s.agent.mode='voice';s.agent.phase='denied';s.agent.origin='agent'}
 if(value==='voice-error'){s.agent.open=true;s.agent.mode='voice';s.agent.phase='voice-error';s.agent.origin='agent'}
 if(value==='image-error'){s.failImage=true;s.agent.open=true;s.agent.mode='image';s.agent.images=1;s.agent.phase='image-error';s.agent.task='record';s.agent.origin='agent';s.failImage=false}

 if(s.budget)s.budgets=[s.budget];
 if(['collection','dry','long-list'].includes(value)){s.budgets=sampleBudgets();s.records=demoRecords();s.budget=s.budgets[0];s.focusID=s.budget.id;s.tab='home';}
 if(value==='dry'){s.records=s.records.filter(r=>r.budgetID!=='daily');s.records.push({id:'r-dry',name:'当前周期消费',cents:300000,day:24,budgetID:'daily'});s.budgets[1].cents=15000;s.tab='budgets';}
 if(value==='long-list'){for(let i=0;i<12;i++)s.budgets.push({id:'extra'+i,name:['四季的花','小城散步','运动与健康','周末电影'][i%4]+' · '+(i+1),cents:60000+i*10000,cycle:'monthly',tint:['lilac','mint','gold','rose'][i%4]});s.tab='budgets';}
 render(true);
}
function handleAction(b){
 const action=b.dataset.action,a=s.agent;if(extraAction(b))return;
 if(action==='tab'){s.tab=b.dataset.tab;s.settings=null;s.detail=null;s.toast=null;render();$('page').scrollTop=0}
 else if(action==='create'||action==='record'){s.modal=null;openAgent(action==='create'?'create':'record',s.tab)}
 else if(action==='agent')openAgent(null,'agent');
 else if(action==='close-agent')closeAgent();
 else if(action==='expand-agent'){if(performance.now()-lastPanelDrag<350)return;a.detent=a.detent===2?0:a.detent+1;a.expanded=a.detent>0;renderOverlay();updateNotes()}
 else if(action==='manual'){a.manual=!a.manual;if(a.manual)a.detent=2;a.expanded=a.detent>0;if(a.task==='general')a.task='record';if(a.manual)a.phase='idle';renderOverlay();updateNotes()}
 else if(action==='send')parseInput();
 else if(action==='confirm')confirm();
 else if(action==='input-mode'){operation++;stopVoiceTimer();a.mode=b.dataset.mode;a.manual=false;a.error='';a.phase=a.mode==='image'?(a.images?'images':'idle'):'idle';renderOverlay();updateNotes()}
 else if(action==='suggest-create'){a.text='日常生活，每月预算 3000 元';a.task='create';a.mode='text';renderOverlay();$('agent-text').focus()}
 else if(action==='suggest-remaining'){a.text='这个月还能花多少？';a.task='general';a.mode='text';a.detent=2;parseInput()}
 else if(action==='suggest-record'){a.text='今天午餐花了 35 元';a.task='record';a.mode='text';renderOverlay();$('agent-text').focus()}
 else if(action==='current-context'){a.discussion=s.budget.name;a.recordBudgetID=s.budget.id;renderOverlay()}
 else if(action==='voice-click'){if(performance.now()-lastVoiceDown<450)return;if(a.phase==='recording')endVoice(false);else startVoice()}
 else if(action==='voice-cancel')endVoice(true);
 else if(action==='voice-to-text'){a.mode='text';a.phase='idle';renderOverlay()}
 else if(action==='voice-retry'){s.denyVoice=false;a.phase='idle';renderOverlay()}
 else if(action==='add-image'){if(a.images<5)a.images++;a.phase='images';renderOverlay()}
 else if(action==='remove-image'){a.images=Math.max(0,a.images-1);renderOverlay()}
 else if(action==='recognize')recognize();
 else if(action==='view-result'){a.open=false;if(!s.detail)s.tab=a.task==='create'?'budgets':'home';render()}
 else if(action==='settings'){s.modal=null;s.settings='root';render();$('page').scrollTop=0}
 else if(action==='settings-back'){s.settings=s.settings==='root'?null:'root';render();$('page').scrollTop=0}
 else if(action==='setting'){s.settings=b.dataset.setting;render();$('page').scrollTop=0}
 else if(action==='add-wish'){s.modal='wish';s.modalError='';renderOverlay()}
 else if(action==='wish-symbol'){s.wishSymbol=b.dataset.symbol;renderOverlay()}
 else if(action==='save-wish'){
  if(!s.newWish.trim()){s.modalError='先给这个心愿一个名字。';renderOverlay();return}
  if(s.wishAmount.trim()&&!cents(s.wishAmount)){s.modalError='预计花费请填大于 0 的金额，或暂时留空。';renderOverlay();return}
  s.wishes.push({id:Date.now(),name:s.newWish.trim(),cents:cents(s.wishAmount),symbol:s.wishSymbol,completed:false});s.modal=null;s.completed=false;s.newWish='';s.wishAmount='';render();toast('心愿已添加，钱包额度保持不变。');
 }
 else if(action==='wish-active'||action==='wish-completed'){s.completed=action==='wish-completed';render()}
 else if(action==='wish-detail'){s.modal={type:'wish',id:Number(b.dataset.id)};renderOverlay()}
 else if(action==='record-detail'){s.modalSource=null;s.modal={type:'record',index:Number(b.dataset.index)};renderOverlay()}
 else if(action==='wallet'||action==='attention'||action==='menu'||action==='unbudgeted'){s.modal=action;renderOverlay()}
 else if(action==='close-modal')closeModal();
 else if(action==='day'){s.selectedDay=Number(b.dataset.day);if(s.modal==='summary-calendar')renderOverlay();else render()}
 else if(action==='dismiss-toast'){s.toast=null;renderToast()}
 else if(action==='undo'){if(s.toast&&s.toast.undo){s.budgets=s.toast.undo.budgets;s.budget=s.budgets.find(b=>b.id===s.toast.undo.budget?.id)||null;s.focusID=s.toast.undo.focusID;s.records=s.toast.undo.records;s.toast=null;s.agent.open=false;s.agent.phase='idle';render(true);toast('已撤销')}}
}

 if(action==='budget-detail'){openDetail(id,b);return true}

 if(action==='pin-budget'){const old=snapshot(),i=s.budgets.findIndex(b=>b.id===id);if(i<0)return true;s.budgets.unshift(...s.budgets.splice(i,1));s.focusID=id;s.modal=null;render(true);toast('已置顶预算卡',old);return true}
 if(action==='confirm-delete-budget'){const target=s.budgets.find(b=>b.id===id);if(!target||budgetRecords(target).length)return true;const old=snapshot();s.budgets=s.budgets.filter(b=>b.id!==id);if(s.budget?.id===id)s.budget=s.budgets[0]||null;if(s.detail===id)s.detail=null;s.focusID=s.budget?.id||null;s.modal=null;render();toast('空卡已移除',old);return true}
 if(action==='confirm-delete-record'){const r=s.records.find(r=>r.id===id);if(s.budgets.find(b=>b.id===r?.budgetID)?.settled)return true;const old=snapshot();s.records=s.records.filter(r=>r.id!==id);s.modal=null;render();toast('记录已删除',old);return true}
 if(action==='confirm-attribution'||action==='apply-attribution'){const r=s.records.find(r=>r.id===id);if(!r||s.budgets.find(b=>b.id===r.budgetID)?.settled)return true;const old=snapshot();if(action==='apply-attribution'){r.unbudgeted=b.dataset.budget==='none';r.budgetID=r.unbudgeted?null:b.dataset.budget}r.pending=false;s.modal=null;render();toast('归属已确认',old);return true}
 if(action==='change-attribution'){s.modal={type:'attribution',id};renderOverlay();return true}
 if(action==='remove-attachment'){const r=s.records.find(r=>r.id===id);if(r){const old=snapshot();r.attachment=false;renderOverlay();toast('演示附件已移除',old)}return true}

 return false;

function moveLift(g,x,y){if(motionReduced())return;const px=Math.max(-1,Math.min(1,(x-g.rect.left)/g.rect.width*2-1)),py=Math.max(-1,Math.min(1,(y-g.rect.top)/g.rect.height*2-1));const free=s.tab==='home'&&!s.detail;g.card.style.transform='translate3d('+(free?(x-g.startX):0)+'px,'+(free?(y-g.startY):-4)+'px,0) scale(1.025) rotateX('+(-py*6)+'deg) rotateY('+(px*8)+'deg)';g.card.style.setProperty('--shine-x',(50+px*40)+'%');g.card.style.setProperty('--shine-y',(50+py*40)+'%')}

},{passive:true});
function endGestures(e,cancelled=false){
