<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CheckLine · 留白玻璃稿</title>
<style>
  :root{color-scheme:light;--ink:#302a39;--muted:#817689;--paper:#f4f1ec}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{max-width:760px;margin:auto;padding:32px 24px 26px}header{margin-bottom:24px}.brand{font-size:12px;letter-spacing:.12em;color:var(--muted)}
  h1{font-size:25px;letter-spacing:-.035em;line-height:1.2;margin:9px 0 12px;font-weight:600}p{margin:0;color:var(--muted);font-size:13px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;min-width:0}.stage{background:#ebe6e0;border-radius:22px;aspect-ratio:1;display:grid;place-items:center;padding:22px}
  .hero{width:100%;height:auto;display:block}.flat{border-radius:23%}figcaption{font-size:13px;font-weight:550;display:flex;justify-content:space-between;align-items:baseline;margin:10px 1px 0;gap:4px}
  figcaption small{font-size:11px;font-weight:400;color:var(--muted)}.sizes{display:flex;align-items:center;gap:14px;margin-top:17px;height:60px}.thumb{display:block;flex:none}.s60{width:60px;height:60px}.s32{width:32px;height:32px}.size-label{font-size:11px;color:var(--muted);line-height:1.4}
  .appearances{margin-top:30px}.appearances .stage{background:#222026;padding:34px}.appearances figure:last-child .stage{background:#ebe6e0}
  details{margin-top:28px;color:var(--muted);font-size:12px}summary{cursor:pointer;width:fit-content}details p{font-size:12px;margin-top:12px}details img{display:block;width:112px;height:112px;margin-top:12px}a{color:#725d93;text-underline-offset:3px}footer{margin-top:22px;font-size:11px;color:var(--muted)}
  @media(min-width:640px){main{padding:44px 40px 32px}.stage{padding:42px}.appearances .stage{padding:58px}}
  @media(max-width:350px){main{padding:24px 16px}.pair{gap:12px}.stage{padding:14px}.appearances .stage{padding:20px}figcaption{display:block}figcaption small{display:block}}
</style>
<main>
  <header><span class="brand">CHECKLINE</span><h1>留白，加一点玻璃。</h1><p>保留轮廓，让边缘受光，下半部轻轻透出紫色。</p></header>
  <section class="pair" aria-label="原稿与玻璃材质对照">
    <figure><div class="stage"><img class="hero flat" src="../lighter-icon.svg" alt="原稿，奶白留白标记与纯紫色背景"></div><figcaption>原稿<small>扁平</small></figcaption><div class="sizes"><img class="thumb s60 flat" src="../lighter-icon.svg" alt="原稿60像素"><img class="thumb s32 flat" src="../lighter-icon.svg" alt="原稿32像素"><span class="size-label">60 / 32<br>px</span></div></figure>
    <figure><div class="stage"><img class="hero" src="default-27.png" alt="Icon Composer玻璃稿，受光边缘与渐透前景"></div><figcaption>玻璃稿<small>Apple 渲染 · 27</small></figcaption><div class="sizes"><img class="thumb s60" src="default-27.png" alt="玻璃稿60像素"><img class="thumb s32" src="default-27.png" alt="玻璃稿32像素"><span class="size-label">60 / 32<br>px</span></div></figure>
  </section>
  <section class="pair appearances" aria-label="系统外观静态导出">
    <figure><div class="stage"><img class="hero" src="dark-refined-27.png" alt="Dark修正版：紫灰背景与浅紫玻璃标记"></div><figcaption>深色修正版<small>Dark · 27</small></figcaption><div class="sizes"><img class="thumb s60" src="dark-refined-27.png" alt="修正深色玻璃稿60像素"><img class="thumb s32" src="dark-refined-27.png" alt="修正深色玻璃稿32像素"><span class="size-label">60 / 32<br>px</span></div></figure>
    <figure><div class="stage"><img class="hero" src="default-26.png" alt="26代材质导出，较圆润的折射边缘"></div><figcaption>另一代材质<small>Default · 26</small></figcaption><div class="sizes"><img class="thumb s60" src="default-26.png" alt="26代玻璃稿60像素"><img class="thumb s32" src="default-26.png" alt="26代玻璃稿32像素"><span class="size-label">60 / 32<br>px</span></div></figure>
  </section>
  <details><summary>材质与工程</summary><p>图片由本机 Icon Composer 27.0 的官方渲染器导出。当前前景透光值为 0.65；原生默认值 0.30 的磨砂对照如下。</p><img src="frosted-27.png" alt="透光值0.30的磨砂对照"><p>最新可编辑文件：<code>CheckLine-Glass-Dark.icon</code>，在 Finder 中双击即可用 Icon Composer 打开。SVG 未烘焙高光，玻璃材质仍可继续调整。</p><p><a href="dark.html">深色前后对照</a> · <a href="https://developer.apple.com/icon-composer/">Apple Icon Composer</a> · <a href="../index.html">回到轮廓精修</a></p></details>
  <footer>静态材质预览，正式 App Icon 尚未替换。</footer>
</main>
</html>
