<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>CheckLine · App Icon 第二轮</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #322d3a;
      background: #f6f5f3;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1180px, 100%); margin: 0 auto; padding: 48px 28px 32px; }
    header { margin-bottom: 40px; }
    .eyebrow { margin: 0 0 10px; color: #766d80; font-size: 13px; letter-spacing: .04em; }
    h1 { margin: 0; font-size: clamp(28px, 3vw, 38px); font-weight: 650; letter-spacing: -.025em; }
    .intro { margin: 12px 0 0; font-size: 15px; color: #766d80; line-height: 1.6; }
    .directions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
    article { min-width: 0; }
    h2 { margin: 0 0 18px; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
    figure { margin: 0; }
    .icon { display: block; object-fit: contain; border-radius: 22.4%; }
    .hero { width: 100%; height: auto; aspect-ratio: 1; }
    figcaption { margin: 18px 0 24px; color: #766d80; font-size: 14px; line-height: 1.65; min-height: 47px; }
    .desktop { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px; border-radius: 18px; }
    .desktop + .desktop { margin-top: 10px; }
    .desktop.light { background: #eeebf2; color: #766d80; }
    .desktop.dark { background: #2d2834; color: #d3cbdc; }
    .desktop-label { margin: 0; font-size: 12px; }
    .samples { display: flex; align-items: center; gap: 20px; }
    .sample { display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .sample.large img { width: 60px; height: 60px; }
    .sample.small img { width: 32px; height: 32px; }
    .sample span { font-size: 11px; white-space: nowrap; }
    footer { margin-top: 32px; color: #827a8b; font-size: 12px; line-height: 1.7; }
    @media (max-width: 820px) {
      main { max-width: 520px; padding: 32px 24px; }
      header { margin-bottom: 32px; }
      .directions { grid-template-columns: minmax(0, 1fr); gap: 44px; }
      figcaption { min-height: 0; }
    }
    @media (max-width: 320px) {
      main { padding-inline: 16px; }
      .desktop { padding: 14px; }
      .samples { gap: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">CHECKLINE · APP ICON</p>
      <h1>小朵，重新成为主角。</h1>
      <p class="intro">第二轮探索 · 先比较构图，再看小尺寸识别。</p>
    </header>
    <section class="directions" aria-label="三个 App Icon 方向">
      <article>
        <h2>① 小朵特写</h2>
        <figure>
          <img class="icon hero" src="01-portrait.png" alt="奶白背景上放大的紫色小朵，侧边轻微裁切，保留奶白双眼" width="1254" height="1254">
          <figcaption>放大熟悉的轮廓与双眼，让小朵直接代表 App。</figcaption>
        </figure>
        <div class="desktop light">
          <p class="desktop-label">浅色桌面</p>
          <div class="samples" aria-label="小朵特写的小尺寸预览">
            <div class="sample large"><img class="icon" src="01-portrait.png" alt="" width="60" height="60"><span>60 px</span></div>
            <div class="sample small"><img class="icon" src="01-portrait.png" alt="" width="32" height="32"><span>32 px</span></div>
          </div>
        </div>
        <div class="desktop dark">
          <p class="desktop-label">深色桌面</p>
          <div class="samples" aria-label="小朵特写的深色桌面预览">
            <div class="sample large"><img class="icon" src="01-portrait.png" alt="" width="60" height="60"><span>60 px</span></div>
            <div class="sample small"><img class="icon" src="01-portrait.png" alt="" width="32" height="32"><span>32 px</span></div>
          </div>
        </div>
      </article>
      <article>
        <h2>② 液位小朵</h2>
        <figure>
          <img class="icon hero" src="02-liquid-cloud.png" alt="完整紫色小朵轮廓，身体内带一条柔和的浅紫液面" width="1254" height="1254">
          <figcaption>把预算液面融进小朵身体，保持一个完整轮廓。</figcaption>
        </figure>
        <div class="desktop light">
          <p class="desktop-label">浅色桌面</p>
          <div class="samples" aria-label="液位小朵的小尺寸预览">
            <div class="sample large"><img class="icon" src="02-liquid-cloud.png" alt="" width="60" height="60"><span>60 px</span></div>
            <div class="sample small"><img class="icon" src="02-liquid-cloud.png" alt="" width="32" height="32"><span>32 px</span></div>
          </div>
        </div>
        <div class="desktop dark">
          <p class="desktop-label">深色桌面</p>
          <div class="samples" aria-label="液位小朵的深色桌面预览">
            <div class="sample large"><img class="icon" src="02-liquid-cloud.png" alt="" width="60" height="60"><span>60 px</span></div>
            <div class="sample small"><img class="icon" src="02-liquid-cloud.png" alt="" width="32" height="32"><span>32 px</span></div>
          </div>
        </div>
      </article>
      <article>
        <h2>③ 云形标志</h2>
        <figure>
          <img class="icon hero" src="03-cloud-mark.png" alt="紫色背景，奶白线条勾勒小朵云形与双眼" width="1254" height="1254">
          <figcaption>用清晰云形与纯色，把小朵收成简洁的品牌标志。</figcaption>
        </figure>
        <div class="desktop light">
          <p class="desktop-label">浅色桌面</p>
          <div class="samples" aria-label="云形标志的小尺寸预览">
            <div class="sample large"><img class="icon" src="03-cloud-mark.png" alt="" width="60" height="60"><span>60 px</span></div>
            <div class="sample small"><img class="icon" src="03-cloud-mark.png" alt="" width="32" height="32"><span>32 px</span></div>
          </div>
        </div>
        <div class="desktop dark">
          <p class="desktop-label">深色桌面</p>
          <div class="samples" aria-label="云形标志的深色桌面预览">
            <div class="sample large"><img class="icon" src="03-cloud-mark.png" alt="" width="60" height="60"><span>60 px</span></div>
            <div class="sample small"><img class="icon" src="03-cloud-mark.png" alt="" width="32" height="32"><span>32 px</span></div>
          </div>
        </div>
      </article>
    </section>
    <footer>候选尚未接受，未替换 App 图标。圆角为 CSS 预览遮罩，非系统裁切；桌面底色不代表独立深色资产。</footer>
  </main>
</body>
</html>
